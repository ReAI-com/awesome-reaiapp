/* ── 公司流程（IPO 网络）：员工只看「我 + 直接上下游」；部门负责人看本部门全貌；管理员看全公司；
   开发者看全公司 + 边绑定的工作流（JOJO 网络风格：圆角矩形节点 + 状态点、贝塞尔边 + 中点菱形、运行中边虚线流动） ── */
const ipoName = (id) => { const e = IPO.entries.find((x) => x.id === id); if (e) return isDev() && e.dev ? e.dev : e.name; const n = IPO.nodes.find((x) => x.id === id); return (n && n.name) || roleById(id).name; };
/* 可见范围：管理员 / 开发者全公司；部门负责人 = 本部门岗位 + 与之直接相连的外部门岗位（虚线，不显示状态） */
function ipoScope() {
  if (atLeast('admin')) return { nodes: new Set(IPO.nodes.map((n) => n.id)), ext: new Set() };
  const dp = deptOf(S.roleId), own = new Set(dp ? dp.roles : [S.roleId]), ext = new Set();
  IPO.edges.forEach(([a, b]) => { if (own.has(a) && IPO.nodes.some((n) => n.id === b) && !own.has(b)) ext.add(b); if (own.has(b) && IPO.nodes.some((n) => n.id === a) && !own.has(a)) ext.add(a); });
  return { nodes: new Set([...own, ...ext]), ext };
}
function ipoGraph() {
  const dv = isDev(), sc = ipoScope();
  const N = {};
  const visEdges = IPO.edges.map((e, i) => [e, i]).filter(([[a, b2]]) => (sc.nodes.has(b2) || IPO.entries.some((x) => x.id === b2)) && (sc.nodes.has(a) || IPO.entries.some((x) => x.id === a)) && !(sc.ext.has(a) && sc.ext.has(b2)));
  const usedEntries = new Set(visEdges.map(([[a]]) => a));
  IPO.entries.filter((e) => usedEntries.has(e.id)).forEach((e) => { N[e.id] = { ...e, name: dv && e.dev ? e.dev : e.name, w: 120, h: 48, entry: true }; });
  IPO.nodes.filter((n) => sc.nodes.has(n.id)).forEach((n) => { N[n.id] = { ...n, w: 168, h: 64, name: n.name || roleById(n.id).name, ext: sc.ext.has(n.id) }; });
  const pathOf = (s, t) => {
    let x1, y1, x2, y2, c1, c2;
    if (t.x > s.x) { x1 = s.x + s.w; y1 = s.y + s.h / 2; x2 = t.x; y2 = t.y + t.h / 2; const dx = Math.max(40, (x2 - x1) / 2); c1 = [x1 + dx, y1]; c2 = [x2 - dx, y2]; }
    else { x1 = s.x; y1 = s.y + s.h / 2; x2 = t.x + t.w; y2 = t.y + t.h / 2; c1 = [x1 - 60, y1]; c2 = [x2 + 60, y2]; }
    const mx = (x1 + 3 * c1[0] + 3 * c2[0] + x2) / 8, my = (y1 + 3 * c1[1] + 3 * c2[1] + y2) / 8;
    return { d: `M${x1},${y1} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${x2},${y2}`, mx, my };
  };
  const marker = (k) => `<marker id="arr-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrow-${k}"/></marker>`;
  const edges = visEdges.map(([[a, b2, k, label, running], i]) => {
    const p = pathOf(N[a], N[b2]);
    /* 边上的菱形 = 查看绑定的工作流：只在开发者视角出现 */
    const dm = k === 'entry' || !dv ? '' : `<g class="dm" tabindex="0" role="button" data-act="ipo-edge" data-id="${i}" aria-label="边：${esc(N[a].name)} 到 ${esc(N[b2].name)}，${esc(EDGE_KIND[k])}，查看绑定的工作流"><circle class="hit" cx="${p.mx}" cy="${p.my}" r="14"/><polygon points="${p.mx},${p.my - 7} ${p.mx + 7},${p.my} ${p.mx},${p.my + 7} ${p.mx - 7},${p.my}"/><title>${esc(label)}</title></g>`;
    return `<path class="edge ${k}${running ? ' running' : ''}" d="${p.d}" marker-end="url(#arr-${k})"><title>${esc(label)}</title></path>${dm}`;
  }).join('');
  const nodes = Object.values(N).map((n) => {
    if (n.entry) return `<g class="node entry" transform="translate(${n.x},${n.y})"><rect class="box" width="${n.w}" height="${n.h}" rx="10"/><text class="nm" x="16" y="29">${esc(n.name)}</text></g>`;
    if (n.ext) return `<g class="node ext" transform="translate(${n.x},${n.y})"><rect class="box" width="${n.w}" height="${n.h}" rx="10"/><text class="nm" x="18" y="27">${esc(n.name)}</text><text class="sub" x="18" y="49">其他部门</text></g>`;
    const cur = n.id === S.roleId, sel = n.id === S.ipoSel;
    const stText = n.off ? '未安装' : dv ? NODE_ST[n.st] : NODE_ST_H[n.st];
    const label = `${n.name}，${stText}，${dv ? '积压' : '待处理'} ${n.backlog}${n.neck ? '，瓶颈' : ''}${cur ? (dv ? '，当前岗位' : '，我') : ''}。${n.off ? '查看未安装说明' : '打开该岗位插件'}`;
    return `<g class="node${cur ? ' cur' : ''}${n.neck ? ' neck' : ''}${n.off ? ' off' : ''}${sel ? ' sel' : ''}" data-node="${n.id}" tabindex="0" role="button" data-act="ipo-node" data-id="${n.id}" aria-label="${esc(label)}" transform="translate(${n.x},${n.y})"><rect class="box" width="${n.w}" height="${n.h}" rx="10"/><circle class="st ${n.off ? 'waiting' : n.st}" cx="18" cy="22" r="4"/><text class="nm" x="30" y="27">${esc(n.name)}</text>${n.neck ? `<text class="neck-tag" x="${n.w - 12}" y="27" text-anchor="end">瓶颈</text>` : cur ? `<text class="sub" x="${n.w - 12}" y="27" text-anchor="end">${dv ? '当前' : '我'}</text>` : ''}<text class="sub" x="18" y="49">${esc(stText)} · ${dv ? '积压' : '待处理'} ${n.backlog}</text></g>`;
  }).join('');

  const general = `<div class="set-card"><div class="set-item"><div class="txt"><b>公司名称</b><span>出现在所有岗位的工作台与导出物抬头。</span></div><div class="ctl"><input class="input" id="setCompany" data-in="company" value="${esc(sd.company != null ? sd.company : co.name)}" aria-label="公司名称"></div></div>

<script>

  const fromMenu = !!(t && el('menuLayer').contains(t)), menuKey = fromMenu ? MENU.key : null;
  if (!t || t.dataset.act !== 'menu') closeMenus(false);
  if (TIP.pinned && (!t || t !== TIP.target)) tipHide();
  if (!t || t.disabled || t.getAttribute('aria-disabled') === 'true') {
    if (e.target === el('scrim')) closeDrawer('scrim');
    if (S.demoMenu && !e.target.closest('[id="demobar"]')) { S.demoMenu = false; renderDemobar(); }

  }
  if (S.demoMenu && !t.closest('[id="demobar"]')) { S.demoMenu = false; renderDemobar(); }
  const h = ACT[t.dataset.act], drawerBefore = S.drawer;
  if (h) h(t.dataset.id, t, t.dataset.id2, e);

  if (fromMenu && menuKey && S.drawer && S.drawer !== drawerBefore && !drawerBefore) S.drawer.returnKey = menuKey;

  if (fromMenu) requestAnimationFrame(() => {

/* 滚动条显隐（U1）：一个委托的 scroll 监听（capture，可捕获任意容器的滚动）给正在滚动的元素加 .is-scrolling；
   全局只有一个清理计时器，按最后滚动时间统一清除，节点脱离文档即丢弃，不为每个元素各挂计时器 */
const SB = { live: new Map(), timer: 0 };
function sbSweep() {
  SB.timer = 0; const now = Date.now(); let next = Infinity;
  SB.live.forEach((at, n) => { if (!n.isConnected || now - at >= 1000) { n.classList.remove('is-scrolling'); SB.live.delete(n); } else next = Math.min(next, at + 1000 - now); });
  if (SB.live.size) SB.timer = setTimeout(sbSweep, Math.max(50, next));
}
document.addEventListener('scroll', (e) => {
  const n = e.target === document ? document.scrollingElement : e.target;
  if (!n || !n.classList) return;
  if (!SB.live.has(n)) n.classList.add('is-scrolling');
  SB.live.set(n, Date.now());
  if (!SB.timer) SB.timer = setTimeout(sbSweep, 1000);
}, { capture: true, passive: true });

// Actual user input is preserved only in bounded memory. No preset business yields.
addSource = function(name, o) {
  const r = role(), rs = RS();
  const bytes = o.bytes && o.bytes.length <= READ_LIMIT ? o.bytes.slice() : null;
  const basis = bytes ? 'bytes' : 'meta';
  const print = bytes ? fpBytes(bytes) : fp(`meta|${name}|${o.size}|${o.lastModified || 0}`);
  const dup = bytes && rs.sources.find(s => s.fpBasis === 'bytes' && s.fp === print && s.bytes && s.bytes.length === bytes.length && s.bytes.every((value,i) => value === bytes[i]));
  if (dup) { rs.highlight = dup.id; toast('内容相同的原件已在本岗内存中保留，未重复添加'); return dup; }
  let text = '';
  const textLike = TEXTY.test(name) || o.origin === 'paste';
  if (bytes && textLike && bytes.length <= TEXT_LIMIT) { try { text = new TextDecoder('utf-8',{fatal:true}).decode(bytes); } catch(e) { /* undecodable data remains bytes */ } }
  const why = !bytes ? '超过 8 MiB，仅登记元信息，未保存文件内容' : textLike && bytes.length > TEXT_LIMIT ? '超过 512 KiB 文本预览上限；原始字节已保留在内存' : '未提供对应整理器，待人工整理';
  const s = {id:`A-${r.id}-${nextId('upload')}`,name,kind:textLike?'txt':'bin',st:'unsup',unsupWhy:why,preview:text ? text.slice(0,1200) + (text.length > 1200 ? '\n（预览截断；完整文本仍在本页内存）' : '') : `（${why}）`,text,bytes,origin:o.origin || 'upload',issues:[],yields:[],fp:print,fpBasis:basis,at:nowStr(),size:o.size,refs:[],by:r.user};
  rs.sources.push(s); rs.highlight=s.id;
  toast(bytes ? '原件已保留在本页内存；未整理入库，刷新后清空' : '只登记了文件信息；超过读取上限，未保存原件内容');
  return s;
};

    const source = srcById(sp.id);
    if (source && source.fpBasis === 'meta') result.body = '<div class="note warn">超过读取上限：仅登记元信息，未保存文件内容。</div>' + result.body.replace('这类文件只保存原件，暂不支持自动整理。','文件内容未读取；只登记了名称、大小等信息。');
    if (source && source.st === 'unsup' && source.bytes) result.body = '<div class="note">原始字节已保留在本页内存；未提供对应整理器，待人工整理。刷新后清空。</div>' + result.body;
  }
  return result;
};

const restaurantDashboard = pageDashboard;
pageDashboard = function() {
  const r = role();
  const tasks = r.legacyTasks || [];
  return `<div class="btns section">${btn('所有 AI 员工','go',{id:'restaurant-home',icon:'grid',sm:true})}${btn('本岗需求与缺口','restaurant-gap',{icon:'list',sm:true})}</div>` + restaurantScopeNote() + restaurantDashboard() + `<details class="restaurant-evidence section"><summary>需求任务与主题对应 · ${tasks.length} 项</summary><div class="restaurant-task-links">${tasks.map(t => btn(t.task,'go',{id:'board:'+t.themeId,kind:'btn-2',sm:true})).join('')}</div></details>`;
};

const restaurantIpo = pageIpo;
pageIpo = function() { return `<div class="note warn">${ic('info')}<span>拟议交接示意 · 尚未接通。连线是界面讨论假设，待处理数为演示值；四位高层不预设分工，部门角色范围仅供视角演示。</span></div>` + restaurantIpo(); };
const restaurantMyFlow = myFlow;
myFlow = function() { return ['chairman','ceo','vp1','vp2'].includes(S.roleId) ? emptyBox('network','职责与交接关系待确认','需要先确认本人授权、岗位职责与资料边界；本原型不预设分管或运行中的交接。') : restaurantMyFlow(); };

const restaurantSourceStatus = srcStatusCell;
srcStatusCell = function(s, detail) { return s.fpBasis === 'meta' ? '<span class="tiny">仅登记信息 · 原件未保存</span>' : restaurantSourceStatus(s,detail); };

ACT['restaurant-gap'] = (id,t) => openDrawer({kind:'restaurant-gap'},t);
ACT['restaurant-role'] = id => { switchRole(id); if (!isMobile()) S.agentOpen = true; go('dashboard'); };

/* ── 启动 ── */
(function init() {
  if (window.innerWidth < 720) { S.agentOpen = false; S.width = '390'; }
  ROLES.forEach((r) => {
    const rs = S.roles[r.id] = initRole(r);
    rs.messages.push({ id: nextId('msg'), at: '2026-10-14 09:00:00', role: 'agent', parts: [{ kind: 'text', text: `我是「${r.name}」岗位 Agent（演示分析）。我基于本岗「${r.bName}」解释数据，事实、推测与过程分开说；需要你确认的事会以确认卡发来。` }, { kind: 'thinking' }] });
  });
  render({ reset: true });
})();
</script>
