<head>

<meta name="description" content="餐饮 AI 员工 v2.1 独立 UI/UX 原型：17 岗位、58 主题，资料复核、候选签字和冻结检查。全部虚构、仅内存、刷新重置。">
<title>餐饮 AI 员工 v2.1 · 独立交互原型</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   【Token】唯一允许出现颜色字面量的区块。
   取值与 docs/plugin-design-system-v1.html（Host design-base.css）一致。
   真实插件里这一段由 Host 注入；设计稿为独立预览自行注入。
   插件自己的别名统一用 --ae-* 前缀，不与 Host Token 撞名。
   ═══════════════════════════════════════════════════════════════════ */
:root{--bg:#f4f3f9;--card-bg:rgba(255,255,255,.8);--card-border:rgba(92,92,224,.1);--card-shadow:0 8px 32px rgba(92,92,224,.07);--text-primary:#1c1c2e;--text-secondary:#6b6b80;--text-tertiary:#a5a5b8;--accent:#5c5ce0;--accent-soft:rgba(92,92,224,.07);--accent-glow:rgba(92,92,224,.22);--alert:#ff3b30;--alert-soft:rgba(255,59,48,.07);--alert-line:rgba(255,59,48,.32);--divider:rgba(92,92,224,.08);--panel-bg:rgba(255,255,255,.9);--panel-border:rgba(92,92,224,.1);--panel-shadow:0 12px 48px rgba(26,26,46,.1);--bound:#1f9d55;--bound-soft:rgba(31,157,85,.1);--bound-line:rgba(31,157,85,.34);--warn:#b3701a;--warn-soft:rgba(179,112,26,.09);--warn-line:rgba(179,112,26,.3);--scroll-thumb:rgba(92,92,224,.16);--scroll-thumb-hi:rgba(92,92,224,.3);
  --ae-on-accent:#fff;--ae-scrim:rgba(20,18,40,.3);color-scheme:light}
[data-theme=dark]{--bg:#0e0e1a;--card-bg:rgba(26,26,46,.8);--card-border:rgba(123,123,247,.12);--card-shadow:0 8px 32px rgba(0,0,0,.3);--text-primary:#ededf5;--text-secondary:#9494a8;--text-tertiary:#505068;--accent:#7b7bf7;--accent-soft:rgba(123,123,247,.1);--accent-glow:rgba(123,123,247,.3);--alert:#ff5a4e;--alert-soft:rgba(255,90,78,.15);--alert-line:rgba(255,90,78,.42);--divider:rgba(123,123,247,.1);--panel-bg:rgba(26,26,46,.95);--panel-border:rgba(123,123,247,.1);--panel-shadow:0 12px 48px rgba(0,0,0,.35);--bound:#3ecf7a;--bound-soft:rgba(62,207,122,.14);--bound-line:rgba(62,207,122,.4);--warn:#f0a94c;--warn-soft:rgba(240,169,76,.14);--warn-line:rgba(240,169,76,.4);--scroll-thumb:rgba(123,123,247,.18);--scroll-thumb-hi:rgba(123,123,247,.34);
  --ae-on-accent:#fff;--ae-scrim:rgba(0,0,0,.45);color-scheme:dark}
/* ═══ Token 区结束：以下样式只允许 var(--token) 或 --ae-* 别名 ═══ */

/* ═══════════════════════════════════════════════════════════════════
   【样式】
   ═══════════════════════════════════════════════════════════════════ */
:root{--ae-nav-w:232px;--ae-rail-w:64px;--ae-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue","Microsoft YaHei",Arial,sans-serif;--ae-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--ae-font);font-size:14px;line-height:1.6;color:var(--text-primary);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
code,.mono{font-family:var(--ae-mono);font-size:12px}
/* 滚动条（U1）：默认透明但保留 thin 占位，显示 / 隐藏都不改变内容宽度；
   悬停在可滚动区域或正在滚动（.is-scrolling，由一个委托的 scroll 监听维护）时淡入，停止约 1 秒后淡出 */
@property --ae-sb{syntax:'<color>';inherits:false;initial-value:transparent}
*{scrollbar-width:thin;scrollbar-color:var(--ae-sb,transparent) transparent}
:hover{--ae-sb:var(--scroll-thumb)}
.is-scrolling{--ae-sb:var(--scroll-thumb-hi)}
.stage,.nav,.content,.ag-msgs,.dr-body,.graph-wrap,.ipo-strip,.kanban,.tbl-wrap,pre.raw,.textarea,.db-controls,.diag pre{transition:--ae-sb .24s ease-out}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:transparent;border-radius:999px}
:hover::-webkit-scrollbar-thumb{background:var(--scroll-thumb)}
.is-scrolling::-webkit-scrollbar-thumb{background:var(--scroll-thumb-hi)}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}

/* §3.1 全局 button 基线 */
button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:inherit;padding:0;margin:0}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}

/* §2 图标：精灵图脱离布局流；14 / 16 / 20 三档 */
.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.i14{width:14px;height:14px;stroke-width:2.4;vertical-align:-2px}
.i20{width:20px;height:20px;stroke-width:2}
.spin{animation:ae-spin 1s linear infinite}
@keyframes ae-spin{to{transform:rotate(360deg)}}

/* §3.2 按钮三档 */
.btn,.btn-2{height:36px;padding:0 16px;border-radius:10px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background-color .16s,border-color .16s,filter .16s,color .16s;flex:none}
.btn{background:var(--accent);color:var(--ae-on-accent)}
.btn:hover:not(:disabled){filter:brightness(.92)}
.btn-2{border:1px solid var(--card-border);color:var(--text-primary);background:transparent}
.btn-2:hover:not(:disabled){background:var(--accent-soft);border-color:var(--accent)}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn-icon{position:relative;width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--text-secondary);transition:background-color .16s,color .16s;flex:none}
.btn-icon:hover:not(:disabled){background:var(--accent-soft);color:var(--text-primary)}
.btn-icon::after{content:"";position:absolute;inset:-6px} /* §3.3 命中区外扩到 44px */
.btn-icon[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
/* 文字按钮：有悬停底色，四周留白 §3.5 */
.btn-text{padding:4px 8px;margin:0 -8px;border-radius:10px;color:var(--accent);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:4px;transition:background-color .16s}
.btn-text:hover:not(:disabled){background:var(--accent-soft)}
/* 刻意的纯文字链接（§3.5 例外）：悬停只加下划线，不铺底色，所以不留内边距 */
.link{padding:0;color:var(--accent);text-align:left;font-weight:500}
.link:hover:not(:disabled){text-decoration:underline}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* 表单控件 */
.input,.textarea,.select-wrap select{width:100%;border:1px solid var(--card-border);background:var(--card-bg);color:var(--text-primary);border-radius:10px;font:inherit;font-size:14px}
.input{height:36px;padding:0 12px}
.textarea{padding:12px;min-height:120px;resize:vertical;line-height:1.6}
.input::placeholder,.textarea::placeholder{color:var(--text-tertiary)}
.input:focus,.textarea:focus,.select-wrap select:focus{border-color:var(--accent);outline:2px solid var(--accent-glow);outline-offset:0}
/* §3.7 下拉统一组件：appearance 归零 + 自绘箭头 + 右侧留白 */
.select-wrap{position:relative;display:inline-flex;align-items:center;min-width:0}
.select-wrap select{appearance:none;-webkit-appearance:none;height:32px;padding:0 32px 0 12px;font-size:13px;cursor:pointer}
.select-wrap .chev{position:absolute;right:8px;display:flex;color:var(--text-tertiary);pointer-events:none}
.field-label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px}

/* 徽标 */
.badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--accent-soft);color:var(--text-secondary);border:1px solid transparent;flex:none}
.badge.b-accent{color:var(--accent);background:var(--accent-soft)}
.badge.b-ok{color:var(--bound);background:var(--bound-soft);border-color:var(--bound-line)}
.badge.b-warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.badge.b-bad{color:var(--alert);background:var(--alert-soft);border-color:var(--alert-line)}
.badge.b-mute{color:var(--text-secondary);background:transparent;border-color:var(--card-border)}
.tb{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:6px;font:600 11px/1 var(--ae-mono);flex:none}
.tb-B{color:var(--accent);background:var(--accent-soft)}
.tb-C{color:var(--bound);background:var(--bound-soft)}
.tb-D{color:var(--warn);background:var(--warn-soft)}
.dot{width:8px;height:8px;border-radius:999px;background:var(--text-tertiary);flex:none;display:inline-block}
.dot.ok{background:var(--bound)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--alert)}.dot.run{background:var(--accent)}

/* ── 演示外壳 ── */
.shell{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.demobar{flex:none;display:flex;align-items:center;gap:16px;padding:8px 16px;border-bottom:1px solid var(--divider);background:var(--accent-soft);position:relative;z-index:60;flex-wrap:wrap}
.db-brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;white-space:nowrap}
.db-brand .badge{font-weight:500}
.db-toggle{display:none}
.db-controls{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;flex:1;min-width:0}
.db-group{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary)}
.db-note{font-size:12px;color:var(--text-tertiary)}
.seg{display:inline-flex;border:1px solid var(--card-border);border-radius:10px;padding:2px;background:var(--card-bg)}
.seg button{height:28px;padding:0 8px;border-radius:6px;font-size:12px;color:var(--text-secondary);white-space:nowrap}
.seg button:hover{color:var(--text-primary);background:var(--accent-soft)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--ae-on-accent)}
.switch{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 8px;margin:0 -8px;border-radius:10px;font-size:12px;color:var(--text-secondary)}
.switch:hover{background:var(--accent-soft);color:var(--text-primary)}
.switch .track{width:32px;height:20px;border-radius:999px;background:var(--text-tertiary);position:relative;transition:background-color .16s;flex:none}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;background:var(--ae-on-accent);transition:transform .16s}
.switch[aria-checked="true"] .track{background:var(--accent)}
.switch[aria-checked="true"] .track::after{transform:translateX(12px)}
.late-pill{display:none}
.late-pill.show{display:inline-flex}

.stage{flex:1;min-height:0;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:stretch}
.win{width:100%;max-width:1280px;height:100%;min-height:560px;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--card-border);border-radius:14px;overflow:hidden;box-shadow:var(--panel-shadow);container:win/inline-size;position:relative}
.stage[data-w="960"] .win{max-width:960px}
.stage[data-w="720"] .win{max-width:720px}
.stage[data-w="390"] .win{max-width:390px;max-height:844px}

/* Host Title Bar 占位：同色连续（§4.6），整条归 Host，不放插件交互 */
.titlebar{height:44px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg);color:var(--text-tertiary);font-size:12px;user-select:none}
.titlebar .tb-dots{display:flex;gap:8px}
.titlebar .tb-dots i{width:12px;height:12px;border-radius:999px;border:1px solid var(--card-border);display:block}
.titlebar .tb-path{color:var(--text-secondary);font-weight:600}
.titlebar .tb-hint{margin-left:auto;padding:0 8px;height:24px;display:inline-flex;align-items:center;border:1px dashed var(--card-border);border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* ── 插件 main-body：左导航 / 内容 / 右侧 Agent ── */
.mainbody{flex:1;min-height:0;position:relative;display:grid;grid-template-columns:var(--ae-nav-w) minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr)}
.nav{grid-column:1;display:flex;flex-direction:column;gap:4px;padding:8px 12px 12px;overflow-y:auto;border-right:1px solid var(--divider);min-height:0}
.nav-role{display:flex;align-items:center;gap:12px;padding:8px 8px 12px}
.nav-role .avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.nav-role b{display:block;font-size:14px;line-height:20px}
.nav-role small{display:block;font-size:12px;color:var(--text-secondary);line-height:16px}
.nav-sec{font-size:12px;color:var(--text-tertiary);padding:12px 8px 4px;display:flex;align-items:center;justify-content:space-between}
.nav-item{display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 8px;border-radius:10px;color:var(--text-secondary);font-size:14px;width:100%;transition:background-color .16s,color .16s;position:relative}
.nav-item:hover{background:var(--accent-soft);color:var(--text-primary)}
.nav-item[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .new{font-size:11px;color:var(--bound)}
.nav-add{color:var(--text-tertiary)}
.nav-foot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--divider)}
.nav-foot .btn-2{width:100%}
.content{grid-column:2;min-width:0;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:24px 32px 48px;scroll-behavior:auto}
.mhead,.tabbar{display:none}
.content:focus{outline:none}

/* 页面结构 */
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head h1{font-size:20px;line-height:28px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.page-head p{color:var(--text-secondary);font-size:13px;margin-top:4px;max-width:72ch}
.meta-row{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:8px;font-size:12px;color:var(--text-secondary)}
.meta-row span{display:inline-flex;align-items:center;gap:4px}
.section{margin-top:24px}
.section:first-child{margin-top:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-head h2{font-size:15px;font-weight:600;line-height:24px;display:flex;align-items:center;gap:8px}
.sec-head .sub{font-size:12px;color:var(--text-secondary)}
.card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px;padding:16px;box-shadow:var(--card-shadow)}
.card-flat{background:var(--card-bg);border:1px solid var(--card-border);border-radius:14px}
.muted{color:var(--text-secondary)}
.tiny{font-size:12px;color:var(--text-tertiary)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}
.note{display:flex;gap:8px;align-items:flex-start;padding:12px;border-radius:10px;background:var(--accent-soft);color:var(--text-secondary);font-size:12px;line-height:20px}
.note .i{margin-top:2px;color:var(--accent)}
.note.warn{background:var(--warn-soft);color:var(--text-primary)}
.note.warn .i{color:var(--warn)}
.note.ok{background:var(--bound-soft);color:var(--text-primary)}
.note.ok .i{color:var(--bound)}

/* IPO 条（工作台） */
.ipo-strip{display:flex;align-items:stretch;gap:4px;overflow-x:auto;padding-bottom:4px}
.ipo-seg{flex:1;min-width:120px;display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-radius:14px;border:1px solid var(--card-border);background:var(--card-bg);transition:border-color .16s,background-color .16s;text-align:left}
.ipo-seg:hover{border-color:var(--accent)}
.ipo-seg .k{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:8px}
.ipo-seg .v{font-size:22px;font-weight:650;line-height:28px;font-variant-numeric:tabular-nums}
.ipo-seg.main{border-color:var(--accent-glow);background:var(--accent-soft)}
.ipo-seg.alert .v{color:var(--alert)}
.ipo-arrow{display:grid;place-items:center;color:var(--text-tertiary);flex:none}

/* 指标卡 */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.metric{padding:16px;border-radius:14px;background:var(--card-bg);border:1px solid var(--card-border);container-type:inline-size;min-width:0}
.metric .k{font-size:12px;color:var(--text-secondary)}
/* 关键数字不得省略：随卡片宽度缩小字号，极窄时换行而不是截断 */
.metric .v{font-size:clamp(14px,12cqi,22px);font-weight:650;line-height:32px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.split .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
.metric .s{font-size:12px;color:var(--text-tertiary)}

/* 图表 */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(64px,140px) minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px}
.bar-row .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-secondary)}
.bar-row .val{font-variant-numeric:tabular-nums;font-size:12px;color:var(--text-primary)}
.bar-svg{width:100%;height:8px;display:block}
.bar-svg .bg{fill:var(--accent-soft)}
.bar-svg .fg{fill:var(--accent)}
.trend-svg{width:100%;height:160px;display:block}
.trend-svg .grid{stroke:var(--divider);stroke-width:1;vector-effect:non-scaling-stroke}
.trend-svg .line{fill:none;stroke:var(--accent);stroke-width:2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.trend-svg .area{fill:var(--accent-soft);stroke:none}
.trend-x{display:flex;justify-content:space-between;font-size:12px;color:var(--text-tertiary);margin-top:4px}

/* 状态列（kanban） */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(180px,1fr);gap:12px;overflow-x:auto;padding-bottom:4px}
.kcol{background:var(--accent-soft);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.kcol h3{font-size:12px;font-weight:600;color:var(--text-secondary);display:flex;justify-content:space-between;padding:4px 4px 0}
.kcard{display:flex;flex-direction:column;gap:4px;padding:12px;border-radius:10px;background:var(--panel-bg);border:1px solid var(--card-border);text-align:left;width:100%;transition:border-color .16s}
.kcard:hover{border-color:var(--accent)}
.kcard b{font-size:13px;font-weight:600;line-height:20px}
.kcard span{font-size:12px;color:var(--text-secondary)}

/* 时间线 */
.timeline{display:flex;flex-direction:column}
.tl-item{display:grid;grid-template-columns:88px 16px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;text-align:left;width:100%;border-radius:10px}
.tl-item:hover .tl-title{color:var(--accent)}
.tl-date{font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.tl-line{position:relative;height:100%;display:grid;place-items:center}
.tl-title{font-size:13px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 记录表 */
.tbl-wrap{overflow-x:auto;border:1px solid var(--card-border);border-radius:14px;background:var(--card-bg)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:12px;font-weight:500;color:var(--text-secondary);text-align:left;padding:8px 12px;border-bottom:1px solid var(--divider);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--divider);white-space:nowrap;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl th.num{text-align:right}
.tbl tr.hl td{background:var(--accent-soft)}
.tbl .cell-title{max-width:240px;overflow:hidden;text-overflow:ellipsis}

/* 列表行 */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--divider);min-width:0}
.li:last-child{border-bottom:0}
.li .ico{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.li .ico.warn{background:var(--warn-soft);color:var(--warn)}
.li .ico.bad{background:var(--alert-soft);color:var(--alert)}
.li .ico.ok{background:var(--bound-soft);color:var(--bound)}
.li .body{flex:1;min-width:0}
.li .t,.li .d{display:block}
.li .t{font-size:14px;font-weight:500;line-height:20px;overflow:hidden;text-overflow:ellipsis}
.li .d{font-size:12px;color:var(--text-secondary);line-height:18px}
button.li{width:100%;text-align:left;transition:background-color .16s}
button.li:hover{background:var(--accent-soft)}

/* 看板卡片目录 */
.board-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.board-card{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;background:var(--card-bg);border:1px solid var(--card-border);text-align:left;transition:border-color .16s}
.board-card:hover{border-color:var(--accent)}
.board-card .top{display:flex;align-items:center;gap:8px;font-weight:600}
.board-card p{font-size:12px;color:var(--text-secondary);line-height:18px}

/* 上传区与数据源 */
.dropzone{border:1px dashed var(--card-border);border-radius:14px;padding:24px;display:flex;align-items:center;gap:16px;background:var(--card-bg);transition:border-color .16s,background-color .16s;flex-wrap:wrap}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
.dropzone .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.dropzone .txt{flex:1;min-width:200px}
.dropzone .txt b{display:block;font-size:14px}
.dropzone .txt span{font-size:12px;color:var(--text-secondary)}
.sources-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.src-card{padding:12px 16px;border-radius:14px;border:1px solid var(--card-border);background:var(--card-bg);display:flex;flex-direction:column;gap:4px}
.src-card .top{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.src-card p{font-size:12px;color:var(--text-secondary);line-height:18px}
.src-card.off{background:transparent}
.src-card.off .top{color:var(--text-secondary)}
.fp{font-family:var(--ae-mono);font-size:12px;color:var(--text-secondary)}

/* 复核问题面板 */
.review{border:1px solid var(--warn-line);background:var(--warn-soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.review.clean{border-color:var(--bound-line);background:var(--bound-soft)}
.review-issue{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;background:var(--panel-bg);font-size:13px;flex-wrap:wrap}
.review-issue .loc{font-family:var(--ae-mono);font-size:12px;color:var(--text-secondary);flex:none}
.review-issue .msg{flex:1;min-width:160px}
.review-issue.fixed .msg{color:var(--text-tertiary);text-decoration:line-through}
.progress-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);min-height:20px}
.indet{width:80px;height:4px;border-radius:999px;background:var(--accent-soft);overflow:hidden;position:relative;flex:none}
.indet::after{content:"";position:absolute;top:0;bottom:0;width:32px;border-radius:999px;background:var(--accent);animation:ae-indet 1.1s ease-in-out infinite}
@keyframes ae-indet{0%{left:-32px}100%{left:80px}}

/* C 交付台 */
.ctask{display:flex;flex-direction:column;gap:16px}
.ctask-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ctask-head h3{font-size:15px;font-weight:600;line-height:24px}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cand{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:14px;border:1px solid var(--card-border);background:var(--card-bg);transition:border-color .16s}
.cand.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cand .ver{font-family:var(--ae-mono);font-size:11px;color:var(--text-tertiary)}
.cand h4{font-size:14px;font-weight:600}
.cand p{font-size:13px;color:var(--text-secondary);line-height:20px;flex:1}
.cand .inp{font-size:11px;color:var(--text-tertiary);font-family:var(--ae-mono);word-break:break-all}
.sign-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:var(--accent-soft)}
.sign-bar .txt{flex:1;min-width:200px;font-size:13px}
.receipt{border:1px solid var(--bound-line);background:var(--bound-soft);border-radius:14px;padding:12px 16px;font-size:13px;display:flex;flex-direction:column;gap:8px}
.receipt.stale{border-color:var(--warn-line);background:var(--warn-soft)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;font-size:12px}
.kv dt{color:var(--text-secondary);white-space:nowrap}
.kv dd{margin:0;word-break:break-all}
.demo-tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding-top:12px;border-top:1px dashed var(--card-border);font-size:12px;color:var(--text-tertiary)}

/* D 验收台 */
.rule-row .tgt{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.outcome{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;white-space:nowrap}
.outcome.pass{color:var(--bound)}.outcome.fail{color:var(--alert)}.outcome.error{color:var(--warn)}.outcome.insufficient{color:var(--text-secondary)}
.run-card{border:1px solid var(--card-border);border-radius:14px;background:var(--card-bg);overflow:hidden}
.run-card.expired{border-style:dashed}
.run-head{display:flex;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--divider);flex-wrap:wrap;font-size:12px;color:var(--text-secondary)}
.run-head b{color:var(--text-primary);font-size:13px}

/* 状态：骨架、空、错误、诊断 */
.skel-wrap{opacity:0;animation:ae-show 0s linear .4s forwards} /* §6：超过 400ms 才显示 */
@keyframes ae-show{to{opacity:1}}
.skel{height:14px;border-radius:6px;background:var(--accent-soft);animation:ae-pulse 1.2s ease-in-out infinite}
.skel.h{height:64px;border-radius:14px}
@keyframes ae-pulse{50%{opacity:.5}}
.state-box{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:24px;border-radius:14px;border:1px solid var(--card-border);background:var(--card-bg)}
.state-box .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.state-box.bad{border-color:var(--alert-line);background:var(--alert-soft)}
.state-box.bad .ico{background:var(--panel-bg);color:var(--alert)}
.state-box.warn{border-color:var(--warn-line);background:var(--warn-soft)}
.state-box.warn .ico{background:var(--panel-bg);color:var(--warn)}
.state-box h3{font-size:15px;font-weight:600}
.state-box p{font-size:13px;color:var(--text-secondary);max-width:64ch}
.state-box.compact{padding:16px}
.diag{width:100%;border:1px solid var(--card-border);border-radius:10px;background:var(--panel-bg);font-size:12px}
.diag summary{cursor:pointer;padding:8px 12px;color:var(--text-secondary);list-style:none;display:flex;align-items:center;gap:8px;border-radius:10px}
.diag summary::-webkit-details-marker{display:none}
.diag summary:hover{background:var(--accent-soft)}
.diag pre{margin:0;padding:8px 12px 12px;white-space:pre-wrap;word-break:break-all;font-family:var(--ae-mono);font-size:11px;color:var(--text-secondary);user-select:text}
.diag .btns{padding:0 12px 12px}
.diag-body{padding:0 12px 12px}
.err-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}

/* 看板调整 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--card-border);font-size:12px;color:var(--text-secondary);background:var(--card-bg);transition:border-color .16s,color .16s}
button.chip:hover{border-color:var(--accent);color:var(--text-primary)}
.chip.static{cursor:default}
.preview-frame{border:1px dashed var(--accent-glow);border-radius:14px;padding:16px;background:var(--bg)}
.preview-tag{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--accent);margin-bottom:12px}
.proposal-explain{display:flex;flex-direction:column;gap:8px;font-size:13px}
.proposal-explain li{display:flex;gap:8px;align-items:baseline}
.proposal-explain li .k{color:var(--text-secondary);min-width:64px;flex:none;font-size:12px}
.bad-ref{color:var(--alert);font-weight:600}

/* IPO 链路 */
.ipo-layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:start}
.dir-group{margin-bottom:12px}
.dir-group h3{font-size:12px;color:var(--text-tertiary);font-weight:500;padding:4px 8px;display:flex;align-items:center;gap:8px}
.dir-item{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:4px 8px;border-radius:10px;font-size:13px;color:var(--text-secondary)}
.dir-item:hover{background:var(--accent-soft);color:var(--text-primary)}
.dir-item[aria-current="true"]{color:var(--accent);background:var(--accent-soft)}
.graph-wrap{overflow:auto;border:1px solid var(--card-border);border-radius:14px;background:var(--card-bg);max-height:640px}
.graph{display:block;width:940px;height:600px}
.graph .edge{fill:none;stroke:var(--text-tertiary);stroke-width:1.5}
.graph .edge.c2a{stroke:var(--accent)}
.graph .edge.dlisten{stroke:var(--warn);stroke-dasharray:2 4}
.graph .edge.reply{stroke:var(--text-secondary);stroke-dasharray:1 3}
.graph .edge.entry{stroke:var(--text-tertiary)}
.graph .edge.running{stroke-dasharray:6 6;animation:ae-flow .9s linear infinite}
@keyframes ae-flow{to{stroke-dashoffset:-12}}
.graph .arrow-c2a{fill:var(--accent)}.graph .arrow-dlisten{fill:var(--warn)}.graph .arrow-reply{fill:var(--text-secondary)}.graph .arrow-entry{fill:var(--text-tertiary)}
.graph .dm{cursor:pointer;outline:none}
.graph .dm polygon{fill:var(--panel-bg);stroke:var(--text-secondary);stroke-width:1.5;transition:fill .16s}
.graph .dm .hit{fill:transparent}
.graph .dm:hover polygon,.graph .dm:focus-visible polygon{fill:var(--accent);stroke:var(--accent)}
.graph .dm:focus-visible .hit{stroke:var(--accent);stroke-width:2}
.graph .node{cursor:pointer;outline:none}
.graph .node rect.box{fill:var(--panel-bg);stroke:var(--card-border);stroke-width:1.5;transition:stroke .16s}
.graph .node:hover rect.box,.graph .node:focus-visible rect.box{stroke:var(--accent)}
.graph .node:focus-visible rect.box{stroke-width:2.5}
.graph .node.cur rect.box{stroke:var(--accent);stroke-width:2}
.graph .node.neck rect.box{stroke:var(--warn);stroke-width:2}
.graph .node.sel rect.box{stroke:var(--accent);stroke-width:3}
.graph .node.off rect.box{stroke-dasharray:4 4;fill:transparent}
.graph .node .nm{fill:var(--text-primary);font-size:13px;font-weight:600}
.graph .node .sub{fill:var(--text-secondary);font-size:11px}
.graph .node .neck-tag{fill:var(--warn);font-size:11px;font-weight:600}
.graph .node.entry rect.box{fill:var(--accent-soft);stroke:transparent}
.graph .st{stroke:none}
.graph .st.waiting{fill:var(--text-tertiary)}.graph .st.running{fill:var(--accent)}.graph .st.done{fill:var(--bound)}.graph .st.stopped{fill:var(--text-secondary)}.graph .st.failed{fill:var(--alert)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--text-secondary);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend svg{width:28px;height:8px}
.legend .l-c2a{stroke:var(--accent);stroke-width:2}
.legend .l-dlisten{stroke:var(--warn);stroke-width:2;stroke-dasharray:2 4}
.legend .l-reply{stroke:var(--text-secondary);stroke-width:2;stroke-dasharray:1 3}
.legend .l-run{stroke:var(--accent);stroke-width:2;stroke-dasharray:6 6}

/* 设置 */
.set-card{border:1px solid var(--card-border);border-radius:14px;background:var(--card-bg)}
.set-item{padding:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.set-item+.set-item{position:relative}
.set-item+.set-item::before{content:"";position:absolute;top:0;left:16px;right:16px;border-top:1px solid var(--divider)}
.set-item .txt{flex:1;min-width:200px}
.set-item .txt b{display:block;font-size:14px;line-height:20px;font-weight:600}
.set-item .txt span{display:block;font-size:12px;line-height:20px;color:var(--text-secondary);margin-top:4px}
.set-item .ctl{flex:none;min-width:0}
.set-item .ctl .input{width:240px;max-width:100%}
.set-feedback{width:100%;font-size:12px;color:var(--text-secondary)}
.checks{display:flex;flex-direction:column;gap:8px;width:100%}
.check{display:flex;align-items:flex-start;gap:8px;font-size:13px;cursor:pointer;padding:4px 0}
.check input{width:16px;height:16px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.check small{display:block;font-size:12px;color:var(--text-secondary)}
.check.dis{cursor:not-allowed;color:var(--text-tertiary)}
.set-foot{display:flex;align-items:center;gap:16px;padding:24px 0 8px;font-size:12px;color:var(--text-secondary);flex-wrap:wrap}

/* Agent 面板（非模态） */
.agent{grid-column:3;display:none;flex-direction:column;width:min(360px,34cqw);margin:12px 12px 12px 0;min-height:0;border:1px solid var(--panel-border);border-radius:14px;background:var(--panel-bg);box-shadow:var(--card-shadow);overflow:hidden}
.agent.open{display:flex}
.ag-head{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--divider)}
.ag-head .ttl{flex:1;min-width:0}
.ag-head .ttl b{display:block;font-size:14px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-head .ttl span{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary)}
.ag-mode{padding:8px 16px;font-size:12px;color:var(--text-secondary);background:var(--warn-soft);border-bottom:1px solid var(--divider);line-height:18px}
.ag-msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;flex-direction:column;gap:8px;max-width:100%}
.msg.m-user{align-items:flex-end}
.msg .bubble{padding:8px 12px;border-radius:14px;font-size:13px;line-height:20px;max-width:92%;overflow-wrap:anywhere}
.msg.m-user .bubble{background:var(--accent);color:var(--ae-on-accent)}
.msg.m-agent .bubble{background:var(--card-bg);border:1px solid var(--card-border)}
.msg.m-system .bubble{background:transparent;color:var(--text-secondary);font-size:12px;padding:0 4px}
.msg .who{font-size:11px;color:var(--text-tertiary);display:flex;gap:8px;align-items:center}
.part-tool{display:flex;flex-direction:column;border:1px solid var(--card-border);border-radius:10px;font-size:12px;color:var(--text-secondary);background:var(--card-bg)}
.part-tool summary{display:flex;align-items:center;gap:8px;padding:8px 12px;cursor:pointer;list-style:none;border-radius:10px}
.part-tool summary::-webkit-details-marker{display:none}
.part-tool summary:hover{background:var(--accent-soft)}
.part-tool .tool-body{padding:0 12px 8px 36px;display:flex;flex-direction:column;gap:4px}
.part-think{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-tertiary);padding:0 4px}
.part-ctx{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--text-secondary);padding:2px 8px;border-radius:6px;border:1px dashed var(--card-border);align-self:flex-start}
.ref-card{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px;border:1px solid var(--card-border);background:var(--card-bg);text-align:left;width:100%;transition:border-color .16s}
.ref-card:hover{border-color:var(--accent)}
.li-ico{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.card-flat>.sec-head{margin-bottom:0}
.cand .btn-2{align-self:flex-start}
.ref-card .body{flex:1;min-width:0}
.ref-card b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref-card span{display:block;font-size:11px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix{border:1px solid var(--accent-glow);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--card-bg)}
.ix.st-answered,.ix.st-cancelled,.ix.st-expired{border-color:var(--card-border)}
.ix .ix-top{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-secondary)}
.ix .ix-prompt{font-size:13px;line-height:20px;font-weight:500}
.ix .ix-steps{display:flex;flex-direction:column;gap:4px;font-size:12px}
.ix .ix-step{display:flex;align-items:center;gap:8px;color:var(--text-secondary)}
.ix .ix-step.ok{color:var(--bound)}.ix .ix-step.bad{color:var(--alert)}.ix .ix-step.warn{color:var(--warn)}
.typing{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);padding:0 4px}
.ag-list{display:flex;flex-direction:column;gap:16px}
.ag-typing:empty{display:none}
.ag-more{align-self:center;margin:0}
.ag-suggest{padding:8px 16px 0;display:flex;flex-direction:column;gap:8px}
.ag-suggest .chip{justify-content:flex-start;height:auto;min-height:28px;padding:4px 12px;text-align:left;line-height:18px;border-radius:10px}
.ag-input{padding:12px 16px 16px;display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--divider)}
.ag-input .textarea{min-height:40px;max-height:120px;padding:8px 12px;font-size:13px;resize:none}

/* 抽屉（§5）：锚定 main-body，遮罩 30 / 面板 31 */
.layer{position:absolute;inset:0;z-index:30;visibility:hidden;pointer-events:none}
.layer.open{visibility:visible;pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--ae-scrim);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);opacity:0;transition:opacity .12s ease-out}
.layer.open .scrim{opacity:1}
.drawer{position:absolute;z-index:31;top:0;right:0;bottom:0;width:min(360px,calc(100% - 24px));background:var(--panel-bg);border-left:1px solid var(--panel-border);border-radius:14px 0 0 14px;box-shadow:var(--panel-shadow);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .12s ease-out;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.layer.open .drawer{transform:none}
.dr-head{display:flex;align-items:flex-start;gap:12px;padding:20px 20px 12px 24px}
.dr-head .ttl{flex:1;min-width:0}
.dr-head h2{font-size:16px;font-weight:600;line-height:24px;overflow-wrap:anywhere}
.dr-head .sub{font-size:12px;color:var(--text-secondary);margin-top:4px}
.dr-head .btn-icon{margin-top:-4px}
.dr-body{flex:1;min-height:0;overflow-y:auto;padding:4px 24px 24px;display:flex;flex-direction:column;gap:16px}
.dr-foot{padding:12px 24px 20px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--divider)}
.dr-sec h3{font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.chain{display:flex;flex-direction:column;gap:0}
.chain-step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;position:relative;padding-bottom:12px}
.chain-step:not(:last-child)::before{content:"";position:absolute;left:11px;top:24px;bottom:0;border-left:1px dashed var(--card-border)}
.chain-step .ci{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.chain-step .cb{font-size:13px;line-height:20px;padding-top:2px;min-width:0;overflow-wrap:anywhere}
.chain-step .cb small{display:block;font-size:12px;color:var(--text-secondary)}
pre.raw{margin:0;padding:12px;border-radius:10px;background:var(--accent-soft);font-family:var(--ae-mono);font-size:11px;line-height:18px;white-space:pre-wrap;word-break:break-all;color:var(--text-secondary);max-height:220px;overflow:auto}
.hist li{display:flex;gap:8px;font-size:12px;padding:4px 0;color:var(--text-secondary)}
.hist li b{color:var(--text-primary);font-weight:600;font-family:var(--ae-mono)}

/* Toast（全局提示层 50+） */
.toast{position:absolute;left:50%;bottom:24px;transform:translate(-50%,8px);z-index:50;max-width:min(480px,calc(100% - 32px));padding:8px 16px;border-radius:10px;background:var(--text-primary);color:var(--bg);font-size:13px;line-height:20px;opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 悬停提示统一组件（v2.1）：延迟 300ms 出现，键盘聚焦也显示，触屏改为点击 (i)；贴在目标旁，不遮挡主操作 */
.tip{position:fixed;z-index:70;left:0;top:0;max-width:min(300px,calc(100vw - 16px));padding:8px 12px;border-radius:10px;background:var(--text-primary);color:var(--bg);font-size:12px;line-height:18px;pointer-events:none;opacity:0;transition:opacity .12s ease-out;overflow-wrap:anywhere}
.tip.show{opacity:1}
.tip-btn{position:relative;width:20px;height:20px;border-radius:999px;display:inline-grid;place-items:center;color:var(--text-tertiary);flex:none;vertical-align:middle;transition:color .16s,background-color .16s}
.tip-btn::after{content:"";position:absolute;inset:-6px}
.tip-btn:hover,.tip-btn[aria-expanded="true"]{color:var(--accent);background:var(--accent-soft)}
.h-tip{display:inline-flex;align-items:center;gap:4px}
/* 「更多」菜单：不常用操作默认收起，点击 ⋯ 展开。菜单是 main-body 内的独立浮层（不在卡片里），
   位置由脚本按触发按钮写进专用样式规则：默认在按钮下方右对齐，下方空间不足时翻到上方，左右夹在可视区内 */
.more-wrap{display:inline-flex;flex:none}
.menu{position:absolute;left:0;top:0;z-index:40;min-width:180px;max-width:calc(100% - 16px);padding:4px;border-radius:10px;background:var(--panel-bg);border:1px solid var(--panel-border);box-shadow:var(--panel-shadow);display:flex;flex-direction:column;gap:2px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 12px;border-radius:6px;font-size:13px;color:var(--text-primary);white-space:nowrap;text-align:left}
.menu button:hover:not(:disabled){background:var(--accent-soft)}
/* 公司流程（员工视角）：上游 → 我 → 下游 */
.flow3{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1.1fr) 24px minmax(0,1fr);gap:8px;align-items:start}
.flow-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.flow-col>h3{font-size:12px;font-weight:600;color:var(--text-secondary);padding:0 4px}
.flow-arrow{display:grid;place-items:center;color:var(--text-tertiary);padding-top:40px}
.flow-card{padding:12px 16px;border-radius:14px;border:1px solid var(--card-border);background:var(--card-bg);display:flex;flex-direction:column;gap:4px;min-width:0}
.flow-card .top{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;flex-wrap:wrap}
.flow-card .d{font-size:12px;color:var(--text-secondary);line-height:18px}
.flow-me{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft);padding:16px}
.flow-me .big{font-size:22px;font-weight:650;line-height:28px;font-variant-numeric:tabular-nums}
.flow-me.neck{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset;background:var(--warn-soft)}
.graph .node.ext{cursor:default}
.graph .node.ext rect.box{stroke-dasharray:2 4;fill:transparent}
.graph .node.ext .nm{fill:var(--text-secondary)}
.src-tabs{margin-bottom:16px}
.status-cell{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ── 紧凑 720–1023：导航收为图标栏，Agent 覆盖右侧 ── */
@container win (max-width:1023px){
  .mainbody{grid-template-columns:var(--ae-rail-w) minmax(0,1fr)}
  .nav{padding:8px;align-items:center}
  .nav-role{padding:4px 0 8px;justify-content:center}
  .nav-role .meta,.nav-sec span,.nav-item .lbl,.nav-item .new,.nav-foot .btn-2 .lbl{display:none}
  .nav-sec{padding:8px 0 4px;justify-content:center}
  .nav-sec::before{content:"";width:24px;border-top:1px solid var(--divider)}
  .nav-item{width:44px;justify-content:center;padding:4px}
  .nav-item .tb{position:absolute;right:0;top:0;min-width:16px;height:16px;font-size:10px}
  .nav-foot{width:100%;align-items:center}
  .nav-foot .btn-2{width:44px;padding:0}
  .content{padding:20px 24px 40px}
  .agent{background:linear-gradient(var(--panel-bg),var(--panel-bg)),var(--bg);grid-column:auto;grid-row:auto;position:absolute;z-index:20;top:12px;right:12px;bottom:12px;margin:0;width:min(360px,calc(100% - var(--ae-rail-w) - 24px));box-shadow:var(--panel-shadow)}
  .split{grid-template-columns:minmax(0,1fr)}
  .ipo-layout{grid-template-columns:minmax(0,1fr)}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* ── 手机 <720：顶部岗位标题 + 底部标签栏，Agent 全屏，抽屉改底部弹出 ── */
@container win (max-width:719px){
  .mainbody{grid-template-columns:minmax(0,1fr);grid-template-rows:48px minmax(0,1fr) 60px}
  .nav{display:none}
  .mhead{display:flex;grid-row:1;grid-column:1;align-items:center;gap:8px;padding:0 8px 0 16px;border-bottom:1px solid var(--divider);min-width:0}
  .mhead .ttl{flex:1;min-width:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
  .content{grid-row:2;grid-column:1;padding:16px 16px 32px}
  .tabbar{display:grid;grid-row:3;grid-column:1;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--divider);background:var(--bg)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--text-secondary)}
  .tabbar button:hover{color:var(--text-primary)}
  .tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
  .agent{inset:0;top:0;right:0;bottom:0;width:auto;border-radius:0;border:0;z-index:25}
  .drawer{top:auto;left:0;right:0;bottom:0;width:auto;max-height:85%;border-radius:14px 14px 0 0;border-left:0;border-top:1px solid var(--panel-border);transform:translateY(100%)}
  .dr-head{padding:16px 16px 8px 20px}
  .dr-body{padding:4px 20px 20px}
  .dr-foot{padding:12px 20px 16px}
  .page-head h1{font-size:18px;line-height:26px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .metric .v{font-size:18px}
  .ipo-strip{flex-wrap:nowrap}
  .ipo-arrow{display:none}
  .ipo-seg{min-width:128px;padding:8px 12px}
  .ipo-seg .k{white-space:nowrap}
  .ipo-seg .v{font-size:18px}
  .bar-row{grid-template-columns:72px minmax(0,1fr) auto}
  .tl-item{grid-template-columns:72px 12px minmax(0,1fr) auto;gap:8px}
  .titlebar .tb-hint{display:none}
  .flow3{grid-template-columns:minmax(0,1fr)}
  .flow-arrow{padding:0;transform:rotate(90deg)}
  .status-cell{flex-wrap:nowrap}
}
/* 真实窄视口：演示外壳控件收进「演示设置」 */
@media (max-width:719px){
  .demobar{padding:8px 12px;gap:8px;flex-wrap:nowrap}
  .db-brand{flex:1;min-width:0;overflow:hidden}
  .db-brand .full{display:none}
  .db-toggle{display:inline-flex}
  .db-controls{display:none;position:absolute;left:8px;right:8px;top:calc(100% + 4px);flex-direction:column;align-items:stretch;gap:12px;padding:16px;border-radius:14px;background:var(--panel-bg);border:1px solid var(--panel-border);box-shadow:var(--panel-shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .db-controls.open{display:flex}
  .db-group{flex-wrap:wrap}
  .stage{padding:0}
  .win{border-radius:0;border:0;box-shadow:none;min-height:0;max-height:none}
  .stage[data-w] .win{max-width:none;max-height:none}
}
@media (prefers-reduced-motion:reduce){
  .drawer,.scrim,.toast,.switch .track::after,.tip{transition:none}
  .graph .edge.running,.spin,.indet::after,.skel{animation:none}
  .stage,.nav,.content,.ag-msgs,.dr-body,.graph-wrap,.ipo-strip,.kanban,.tbl-wrap,pre.raw,.textarea,.db-controls,.diag pre{transition:none}
}

.restaurant-hero{padding:26px;border:1px solid var(--divider);border-radius:14px;background:var(--card-bg);margin:0 0 20px;position:relative;overflow:hidden}
.restaurant-eyebrow{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:700;margin-bottom:10px}
.restaurant-hero h1{font-size:27px;line-height:1.35;margin:0 0 10px;letter-spacing:-.6px}
.restaurant-hero p{font-size:13px;line-height:1.8;color:var(--text-secondary);max-width:620px;margin:0 0 16px}
.restaurant-stats{display:flex;gap:24px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--divider)}
.restaurant-stats b{font-size:22px;font-variant-numeric:tabular-nums;display:block;color:var(--text-primary)}
.restaurant-stats span{font-size:11px;color:var(--text-secondary)}
.restaurant-roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:22px}
.restaurant-role{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--card-bg);border:1px solid var(--divider);border-radius:12px;padding:17px;color:var(--text-primary);min-width:0}
.restaurant-role:hover{border-color:var(--accent);box-shadow:0 3px 14px rgb(110 86 207 / .08)}
.restaurant-role .top{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:650}
.restaurant-role p{margin:0;color:var(--text-secondary);font-size:12px;line-height:1.65;min-height:38px}
.restaurant-role .bottom{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--text-secondary);margin-top:auto}
.restaurant-role .bottom .arrow{margin-left:auto;color:var(--accent)}
.restaurant-group-head{display:flex;align-items:center;gap:10px;margin:24px 0 12px;font-size:13px}
.restaurant-group-head small{font-weight:400;color:var(--text-secondary)}
.restaurant-task-links{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.restaurant-evidence{padding:14px;border:1px solid var(--divider);border-radius:12px}
.restaurant-evidence>summary{cursor:pointer;font-size:13px;font-weight:600;padding:4px}
.restaurant-section{margin-top:20px}.restaurant-section .sec-head{align-items:flex-start}
.restaurant-section h2{font-size:14px}.restaurant-section .tbl th,.restaurant-section .tbl td{white-space:normal;min-width:100px;max-width:320px;overflow-wrap:anywhere}
.restaurant-section .tbl .cell-title{min-width:155px}
.restaurant-scope{margin-bottom:16px}.restaurant-gap-list{padding-left:18px;font-size:12px;line-height:1.8}
.restaurant-compare{display:flex;gap:10px;flex-wrap:wrap}.restaurant-compare a{color:var(--accent);font-size:12px;text-decoration:underline;text-underline-offset:3px}
.restaurant-disclaimer{font-size:11px;color:var(--text-secondary);line-height:1.7;margin:12px 0}
@media(max-width:719px){.restaurant-hero{padding:18px}.restaurant-hero h1{font-size:23px}.restaurant-roles{grid-template-columns:1fr}.restaurant-stats{gap:18px}.db-brand .badge{display:none}.db-brand [data-act="restaurant-gap"]{display:none}}

    const isAgg = ['sum', 'avg', 'diff'].includes(m.op);

    const sub = m.op === 'count' ? '条记录' : m.op === 'distinct' ? `按「${f ? f.label : m.f}」去重` : m.op === 'diff' ? `${b.metrics[m.a].l} − ${b.metrics[m.b].l}` : m.op === 'avg' ? '平均值' : '合计';

    const max = Math.max(...pts.map((p) => p[1])) || 1;

  const metric = semOf().metric;
  return `<div class="section"><div class="sec-head"><h2>${ic('columns')}按「${esc(f.label)}」分列</h2><span class="sub">点卡片打开记录</span></div><div class="kanban">${f.options.map((o) => {
    const list = recs.filter((x) => x.values[f.key] === o);
    return `<div class="kcol"><h3><span>${esc(o)}</span><span>${list.length}</span></h3>${list.map((x) => `<button type="button" class="kcard" ${openRecAttrs(x, preview, b)}><b>${esc(recTitle(x))}</b><span>${metric ? esc(semVal(x.values[metric.key])) + ' · ' : ''}${esc(ORIGIN[x.origin][0])}${isDev() ? ` · v${x.v}` : ''}</span></button>`).join('') || '<span class="tiny">暂无</span>'}</div>`;
  }).join('')}</div></div>`;
}
function timelineHtml(b, recs, preview) {
  const t = b.timeline; if (!t) return '';
  const list = recs.slice().sort((a, c) => String(a.values[t.d]).localeCompare(String(c.values[t.d])));
  const tone = (s) => (/逾期|风险/.test(s) ? 'bad' : /完成|验收|发布|交付/.test(s) ? 'ok' : /进行|跟进|排期/.test(s) ? 'run' : '');
  return `<div class="card section"><div class="sec-head"><h2>${ic('calendar')}时间线</h2><span class="sub">按${esc(fieldOf(t.d).label)}排序</span></div><div class="timeline">${list.map((x) => `<button type="button" class="tl-item" ${openRecAttrs(x, preview, b)}><span class="tl-date">${esc(x.values[t.d])}</span><span class="tl-line"><span class="dot ${tone(String(x.values[t.s]))}"></span></span><span class="tl-title">${esc(x.values[t.t])}</span>${badge(String(x.values[t.s]), tone(String(x.values[t.s])) === 'bad' ? 'b-bad' : tone(String(x.values[t.s])) === 'ok' ? 'b-ok' : 'b-mute')}</button>`).join('')}</div></div>`;
}
function tableHtml(b, recs, preview) {
  const cols = (b.cols || role().fields.slice(0, 4).map((f) => f[0])).map((k) => fieldOf(k)).filter(Boolean);
  const tf = titleField();
  let list = recs.slice();
  if (b.sort) list.sort((a, c) => Number(c.values[b.sort[0]]) - Number(a.values[b.sort[0]]));
  /* 版本列只在开发者视角常驻；其他视角在记录详情里看「第 n 版」 */
  const dv = isDev();
  return `<div class="section"><div class="sec-head"><h2>${ic('list')}记录 · ${list.length} 条</h2><span class="sub">${dv ? '读取：本岗 B' : '来自'}「${esc(role().bName)}」${b.filter ? ' · 筛选：' + esc(condText(b.filter)) : ''}</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map((c) => `<th class="${['m', 'n', 'p'].includes(c.type) ? 'num' : ''}">${esc(c.label)}</th>`).join('')}<th>来源</th>${dv ? '<th>版本</th>' : ''}</tr></thead><tbody>
    ${list.map((x) => `<tr class="${RS().highlight === x.id ? 'hl' : ''}">${cols.map((c) => c.key === tf ? `<td class="cell-title"><button type="button" class="link" ${openRecAttrs(x, preview, b)}>${esc(x.values[c.key])}</button></td>` : `<td class="${['m', 'n', 'p'].includes(c.type) ? 'num' : ''}">${esc(fmtVal(c.key, x.values[c.key]))}</td>`).join('')}<td>${originBadge(x.origin)}</td>${dv ? `<td class="mono">v${x.v}</td>` : ''}</tr>`).join('')}
    </tbody></table></div></div>`;
}
function bView(b, o = {}) {
  if (b.sections) return restaurantSectionViews(b, o);
  const r = role();
  const recs = applyF(o.recs || recList(), b.filter);
  if (!recs.length) {
    return emptyBox('inbox', '本看板还没有数据', S.demo === 'empty' ? `「${r.bName}」中暂无记录：资料还没有整理入库。` : `「${r.bName}」中没有符合「${condText(b.filter)}」的记录。`, o.preview ? '' : btn('去上传资料', 'go', { id: 'sources', icon: 'upload' }));
  }
  return metricsHtml(b, recs) + chartHtml(b, recs) + (b.kanban ? kanbanHtml(b, recs, o.preview) : '') + timelineHtml(b, recs, o.preview) + tableHtml(b, recs, o.preview);
}
</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   【渲染】页面：工作台 / 主题看板（B·C·D）/ 原始资料 / IPO / 工作流 / 看板调整 / 设置
   ═══════════════════════════════════════════════════════════════════ */
/* 检查类计数：开发者看「最近一次运行的未通过结果数」；其余视角与待人确认列表同口径（过期算 1 件，否则为未升级的业务未通过 / 证据不足） */
function dFailCount(rs, b) { const run = runList(rs.d[b.id])[0]; return run ? run.results.filter((x) => x.outcome !== 'pass').length : 0; }
function dTodoCount(rs, b) {
  const d = rs.d[b.id], run = runList(d)[0]; if (!run) return 0;
  if (runExpired(run, d)) return 1;
  return run.results.filter((x) => (x.outcome === 'fail' || x.outcome === 'insufficient') && !(d.escalated[x.id] && d.escalated[x.id].state !== 'pending')).length;
}
function queueItems() {
  const r = role(), rs = RS(), out = [], dv = isDev();
  if (S.demo === 'empty') return out;
  rs.sources.filter((s) => s.st === 'issue' && !s.auto).forEach((s) => out.push({ icon: 'alert', tone: 'warn', t: dv ? `「${s.name}」有 ${s.issues.filter((x) => !x.excluded).length} 个复核问题` : `「${s.name}」有 ${s.issues.filter((x) => !x.excluded).length} 处需要你确认`, d: dv ? '含无效行，整批未发布' : '确认前整批不会入库', act: 'organize', id: s.id }));
  rs.sources.filter((s) => s.st === 'ready' && !s.auto).forEach((s) => out.push({ icon: 'file', tone: '', t: dv ? `「${s.name}」已整理，待复核发布` : `「${s.name}」已整理 ${s.yields.length} 条，待你确认`, d: dv ? (s.origin === 'derived' ? '回流快照，发布后成为回流 B' : '发布后成为 B') : `确认后加入「${r.bName}」`, act: 'organize', id: s.id }));
  cTasks(r).forEach(({ board: b, task: t }) => {
    const st = rs.c[t.id];
    const lost = Object.values(st.requests).filter((q) => q.status === 'lost').length;
    if (lost) out.push({ icon: 'alert', tone: 'warn', t: dv ? `「${t.title}」有 ${lost} 个签字请求结果未知` : `「${t.title}」签字结果待确认`, d: dv ? '用原幂等键再次提交以确认结果' : '再次确认是安全的，不会重复签字', act: 'go', id: 'board:' + b.id });
    if (st.receipt && receiptStale(st)) out.push({ icon: 'alert', tone: 'warn', t: `「${t.title}」${receiptInputsStale(st) ? (dv ? '输入已更新' : '数据已更新') : '候选已重新生成'}`, d: dv ? '签字基于旧版本，需重新选定并签字' : '之前的签字基于旧内容，需要重新选定并签字', act: 'go', id: 'board:' + b.id });
    else if (!st.receipt) out.push({ icon: 'pen', tone: '', t: `「${t.title}」待选定并签字`, d: `${st.cands.length} 个候选 · ${b.title}`, act: 'go', id: 'board:' + b.id });
  });
  r.boards.filter((b) => b.type === 'D').forEach((b) => {
    const d = rs.d[b.id], run = runList(d)[0]; if (!run) return;
    const exp = runExpired(run, d);
    if (exp) { out.push({ icon: 'clock', tone: 'warn', t: `「${b.title}」结论已过期`, d: dv ? `${exp}，需重新检查` : '数据或规则有更新，需要重新检查', act: 'go', id: 'board:' + b.id }); return; }
    run.results.filter((x) => (x.outcome === 'fail' || x.outcome === 'insufficient') && !(d.escalated[x.id] && d.escalated[x.id].state !== 'pending')).forEach((x) => out.push({ icon: 'x-circle', tone: 'bad', t: `${b.title}：${resObj(x)}`, d: OUTCOME[x.outcome][0] + ' · ' + resMsg(x), act: 'open-dres', id: `${b.id}|${x.id}` }));
  });
  const p = curProposal(rs);
  if (p && !p.err && !rs.adjust.added[p.id]) out.push({ icon: 'sliders', tone: '', t: `看板提案「${p.board.title}」待确认`, d: '只读预览，确认后加入导航', act: 'go', id: 'adjust' });
  return out;
}
/* 主题看板卡：员工视角只显示图标 + 名称，用途放进悬停提示；开发者视角显示范式徽标与用途 */
function boardCards(extraP) {
  const dv = isDev();
  return `<div class="board-cards">${allBoards().map((b) => `<button type="button" class="board-card" data-act="go" data-id="board:${esc(b.id)}"${dv ? '' : ` data-tip="${esc(b.purpose)}"`}><span class="top">${ic(b.icon)}${esc(b.title)}<span class="spacer"></span>${typeBadge(b.type)}</span>${dv ? `<p>${esc(b.purpose)}</p>` : ''}</button>`).join('')}<button type="button" class="board-card" data-act="go" data-id="adjust"${dv ? '' : ' data-tip="用一句话描述想看的内容，确认后加入导航"'}><span class="top">${ic('plus')}调整看板</span>${dv ? `<p>${esc(extraP)}</p>` : ''}</button></div>`;
}
function pageDashboard() {
  const r = role(), rs = RS(), dv = isDev();
  const srcs = srcList(), recs = recList();
  /* 开发者按问题处数；其余视角按「待你确认的资料份数」，与下方待人确认列表中的资料条目一一对应 */
  const issues = dv ? srcs.reduce((n, s) => n + (s.st === 'issue' ? s.issues.filter((x) => !x.excluded).length : s.st === 'ready' ? 1 : 0), 0) : srcs.filter((s) => s.st === 'issue' || s.st === 'ready').length;
  const firstOf = (t) => r.boards.find((b) => b.type === t);
  /* 流转条：开发者视角保留 A/B/C/D 记号，其余视角用人话 */
  const segs = [
    { k: dv ? 'A 原始资料' : '资料', v: srcs.length, main: true, icon: 'folder', go: 'sources' },
    { k: dv ? '待复核问题' : '待确认资料', v: issues, alert: issues > 0, icon: 'alert', go: 'sources' },
    { k: dv ? `B ${r.bName}` : `已整理 · ${r.bName}`, v: recs.length, main: true, icon: 'database', go: 'board:' + firstOf('B').id },
  ];
  if (has(r, 'C')) { const n = S.demo === 'empty' ? 0 : cTasks(r).filter(({ task: t }) => !rs.c[t.id].receipt || receiptStale(rs.c[t.id])).length; segs.push({ k: dv ? `C 待选签${r.main.includes('C') ? '' : '（组合）'}` : '待交付', v: n, main: r.main.includes('C'), icon: 'pen', go: 'board:' + firstOf('C').id }); }
  if (has(r, 'D')) { const n = S.demo === 'empty' ? 0 : r.boards.filter((b) => b.type === 'D').reduce((s, b) => s + (dv ? dFailCount(rs, b) : dTodoCount(rs, b)), 0); segs.push({ k: dv ? `D 未通过${r.main.includes('D') ? '' : '（组合）'}` : '待检查', v: n, main: r.main.includes('D'), alert: n > 0, icon: 'shield', go: 'board:' + firstOf('D').id }); }
  const q = queueItems();
  const b0 = firstOf('B');
  const strip = `<div class="ipo-strip" role="list" aria-label="工作流转">${segs.map((s, i) => `${i ? `<span class="ipo-arrow" aria-hidden="true">${ic('chevron-right')}</span>` : ''}<button type="button" role="listitem" class="ipo-seg${s.main ? ' main' : ''}${s.alert ? ' alert' : ''}" data-act="go" data-id="${esc(s.go)}"><span class="k">${ic(s.icon, 14)}${esc(s.k)}</span><span class="v">${esc(fmtNum(s.v))}</span></button>`).join('')}</div>`;
  const queue = `<div class="card-flat"><div class="sec-head li"><h2>${ic('inbox')}待人确认 · ${q.length}</h2>${q.length ? btn('处理下一项', q[0].act, { kind: 'btn', id: q[0].id, sm: true, icon: 'arrow-right' }) : ''}</div>
    ${q.length ? `<div class="list">${q.slice(0, 7).map((x) => `<button type="button" class="li" data-act="${esc(x.act)}" data-id="${esc(x.id)}"><span class="ico ${x.tone}">${ic(x.icon)}</span><span class="body"><span class="t">${esc(x.t)}</span><span class="d">${esc(x.d)}</span></span>${ic('chevron-right')}</button>`).join('')}</div>` : `<div class="li"><span class="body"><span class="t">没有需要你确认的事项</span><span class="d">${S.demo === 'empty' ? '还没有资料。可保存原件供界面讨论；内置虚构样例可体验复核。' : '整理、签字与检查都已处理完。'}</span></span>${S.demo === 'empty' ? btn('上传资料', 'upload', { icon: 'upload', sm: true }) : ''}</div>`}</div>`;
  const sub = dv ? `${S.company.name} · ${r.name} AI 员工 · 主范式 ${r.main}${r.combo.length ? '，组合 +' + r.combo.join('+') : ''}` : `${S.company.name} · ${r.name} AI 员工`;
  const meta = dv ? `<span>${ic('folder', 14)}A：${esc(r.aDesc)}</span><span>${ic('database', 14)}B：${esc(r.bName)}</span>${r.cdDesc ? `<span>${ic('layers', 14)}${esc(r.cdDesc)}</span>` : ''}` : '';
  return head(`工作台`, sub, '', meta)
    + offBanner() + noticeHtml()
    + dataState('工作台', 'read:dashboard', () => `${strip}
      <div class="split section"><div class="stack">${queue}</div>
      <div class="stack"><div class="sec-head"><h2>${ic('chart')}${esc(b0.title)} · 关键指标</h2>${btn('打开看板', 'go', { kind: 'btn-text', id: 'board:' + b0.id })}</div>${recs.length ? metricsHtml(b0, restaurantThemeRecords(b0, recs)) : emptyBox('inbox', '还没有整理好的数据', '资料整理入库后，这里显示关键指标。', btn('上传资料', 'upload', { icon: 'upload' }))}</div></div>
      <div class="section"><div class="sec-head"><h2>${ic('layers')}主题看板</h2>${dv ? '<span class="sub">每个看板是一个围绕主题的最小功能界面</span>' : ''}</div>${boardCards('用一句话描述想看的内容，生成只读提案，确认后加入导航。')}</div>`);
}
function pageBoards() {
  return head('主题看板', isDev() ? '按主题划分的最小功能界面；徽标标出 B 看板 / C 交付台 / D 验收台。' : '', '', '', isDev() ? '' : '每个看板围绕一个主题；把鼠标停在看板上可以看到它的用途。') + boardCards('一句话新增看板');

function boardHead(b) {

  if (!isDev()) {
    /* 读取 / 产出 / 可信动作行收进 (i)：只说用途和数据来自哪里 */
    const from = b.type === 'D' ? b.rules.map((x) => x.tgt.label).filter((v, i, a) => a.indexOf(v) === i).join('；') : `本岗「${r.bName}」`;
    return head(titleHtml, '', '', '', `${b.purpose}。数据来自：${from}。`);
  }
  const produce = b.type === 'B' ? '无（只读展示）' : b.type === 'C' ? 'C 交付物（选定签字）' : 'D 检查结果';
  const reads = b.type === 'D' ? b.rules.map((x) => x.tgt.label).filter((v, i, a) => a.indexOf(v) === i).join('；') : `本岗 B「${r.bName}」`;
  return head(titleHtml, b.purpose, '', `<span>${ic('database', 14)}读取：${esc(reads)}</span><span>${ic('arrow-right', 14)}产出：${esc(produce)}</span><span>${ic('shield', 14)}可信动作：${esc([...RS().enabled[b.id] || []].join('、') || '无')}</span>`);

function pageBoard(b) {

}

/* ── C 交付台：候选（版本 + 输入 B 版本）→ 选定 → 签字（回执、幂等键）→ 回流 ── */
function cView(b) {
  if (S.demo === 'empty') return emptyBox('pen', '还没有交付任务', isDev() ? '交付任务来自已发布的 B 与生成工作流；先整理发布 B，再按需求生成候选。' : '交付任务来自已整理的数据；先上传并整理资料，再按需求生成候选。', btn('去上传资料', 'go', { id: 'sources', icon: 'upload' }));
  return b.tasks.map((t) => cTask(b, t)).join('');
}
/* 记录 ID@v 列表 → 人话（记录标题）；开发者视角原样显示引用 */
const refsHuman = (refs) => refs.map((ref) => { const x = recById(ref.split('@v')[0]); return x ? recTitle(x) : '已删除的记录'; }).join('、');
const noteText = (n) => (isDev() ? n.text : n.plain);
function noteBox(n) {
  if (!n) return '';
  const text = noteText(n); if (!text) return ''; /* 只有开发者说法的演示提示不在其他视角出现 */
  return `<div class="note ${n.tone || ''}">${ic(n.tone === 'warn' ? 'alert' : 'info')}<span>${esc(text)}</span></div>`;
}
function cTask(b, t) {
  const rs = RS(), st = rs.c[t.id], dv = isDev();
  const en = rs.enabled[b.id];
  const busy = cBusy(st);
  const sel = st.sel ? st.versions[st.sel] : null;
  const stale = receiptStale(st);
  const reqs = Object.values(st.requests);
  const cands = st.cands.map((c) => {
    const isSel = c.ref === st.sel, signed = st.receipt && st.receipt.cand === c.ref;
    const flag = signed ? badge('已签字', 'b-ok', 'check') : isSel ? badge('已选定', 'b-accent') : '';
    return `<div class="cand${isSel ? ' sel' : ''}">${dv || flag ? `<div class="row">${dv ? `<span class="ver">${esc(c.ref)}</span>` : ''}<span class="spacer"></span>${flag}</div>` : ''}
      <h4>${esc(c.title)}</h4><p>${esc(c.body)}</p>${dv ? `<div class="inp">输入 B：${esc(c.inputs.join('，'))} · 第 ${c.gen} 次生成</div>` : ''}
      ${en.has('select-candidate') ? btn(isSel ? '已选定' : '选定此候选', 'c-select', { id: t.id, id2: c.ref, sm: true, disabled: isSel || busy, icon: isSel ? 'check' : '' }) : '<span class="tiny">「选定候选」未在本看板启用</span>'}</div>`;
  }).join('');
  /* 受理未知的请求逐个保留恢复入口：改选、重新生成都不会覆盖它们 */
  const lost = reqs.filter((q) => q.status === 'lost').map((q) => errorBlock('lost', { compact: true, reason: dv ? `签字请求 ${q.ref}（幂等键 ${q.key}）已提交，但没有拿到受理回执。不会新建请求：用原幂等键与完整原请求再次提交，取回原回执。` : `「${st.versions[q.ref] ? st.versions[q.ref].title : '候选'}」的签字已提交，但没收到确认结果。再次确认是安全的，不会重复签字。`, act: ['c-resubmit', dv ? '用原幂等键再次提交' : '再次确认结果', 'refresh'], id: t.id, id2: q.key, step: 'c.sign/submit', board: b.id })).join('');
  const conflict = reqs.find((q) => q.status === 'conflict');
  const conflictCur = conflict && st.cands.find((c) => c.id === conflict.candId);
  let signBar = '';
  if (conflict) signBar = errorBlock('conflict', { compact: true, reason: dv ? `签字请求 ${conflict.ref}（幂等键 ${conflict.key}）提交时复验失败：该候选已有新版本 ${conflictCur ? conflictCur.ref : ''}（他人修订或重新生成），已拒绝。旧版本内容原样保留在存档中。` : '这个候选刚被别人修改过，签字没有提交。刷新后看最新内容再签字。', act: ['c-refresh', '刷新后重试', 'refresh'], id: t.id, id2: conflict.key, step: 'c.sign/version-check', board: b.id });
  else if (sel) {
    const doneReq = reqs.find((q) => q.status === 'done' && q.ref === sel.ref && q.gen === st.gen);
    if (!doneReq) signBar = `<div class="sign-bar"><span class="txt">已选定「${esc(sel.title)}」${dv ? `<span class="mono">（${esc(sel.ref)}）</span>。签字前请确认内容；签字请求绑定该候选版本、输入 B 版本集合与生成代次。` : '。确认内容后签字。'}</span>${en.has('sign-candidate') ? btn(busy ? '签字提交中…' : '签字确认', 'c-sign', { kind: 'btn', id: t.id, id2: sel.ref, busy, icon: 'pen' }) : '<span class="tiny">「签字确认」未在本看板启用</span>'}</div>`;
  } else if (!st.receipt) signBar = dv ? `<div class="note">${ic('info')}<span>先从下方候选中选定一个版本；选定后会在 Agent 面板生成签字确认卡（已回答 → 提交结果分两步显示）。</span></div>` : '';
  const sub = reqs.find((q) => q.status === 'submitting');
  const progress = sub ? `<div class="progress-line"><span class="indet"></span>${dv ? `正在提交签字 ${esc(sub.ref)}（幂等键 ${esc(sub.key)}）` : '正在提交签字'} · <span data-since="${sub.since}"></span></div>` : '';
  let receipt = '';
  if (st.receipt) {
    const x = st.receipt, req = st.requests[x.key], v = st.versions[x.cand];
    const why = receiptInputsStale(st) ? (dv ? '输入已更新，签字基于旧版本' : '数据已更新，这次签字基于旧内容') : x.gen !== st.gen ? (dv ? `候选已重新生成（当前第 ${st.gen} 次），签字属于第 ${x.gen} 次` : '候选已重新生成，这次签字属于上一批') : '';
    /* 不常用操作收进「更多」：回流、导出、查看历史签字 */
    const menu = moreMenu(`c-${t.id}`, [
      !stale && en.has('reflow-to-b') ? [st.reflowed[x.id] ? '已存为新资料' : (dv ? '回流为 B' : '存为新资料（回流）'), 'c-reflow', { id: t.id, icon: 'reflow', disabled: !!st.reflowed[x.id] }] : null,
      ['导出 PPT / Word / 图片（待接入）', 'noop', { icon: 'download', disabled: true }],
      st.oldReceipts.length ? [`查看历史签字（${st.oldReceipts.length}）`, 'c-history', { id: t.id, icon: 'clock' }] : null,
    ]);
    const details = dv
      ? kv([['签字者', esc(x.signer)], ['时间', esc(x.at)], ['候选版本', mono(x.cand)], ['输入 B 版本', esc(x.inputs.join('，'))], ['生成代次', esc(`第 ${x.gen} 次`)], ['幂等键', mono(x.key)]])
      : `<details class="diag"><summary>${ic('list', 14)}详情</summary><div class="diag-body">${kv([['签字的版本', esc(v ? v.title : '—')], ['基于的数据', esc(refsHuman(x.inputs))], ['签字者', esc(x.signer)], ['时间', esc(x.at)]])}</div></details>`;
    receipt = `<div class="receipt${stale ? ' stale' : ''}"><div class="row">${ic(stale ? 'alert' : 'check-circle')}<b>${stale ? esc(why) : dv ? '签字回执' : `已签字 · ${esc(x.signer)} · ${esc(x.at.slice(5, 16))}`}</b>${req && req.recovered ? badge(dv ? '已用原幂等键取回' : '已取回确认结果', 'b-accent') : ''}<span class="spacer"></span>${dv ? `<span class="mono">${esc(x.id)}</span>` : ''}${menu}</div>
      ${details}
      ${stale ? `<p class="small">${dv ? '旧签字保留，不自动作废，也不静默沿用。需要时按最新输入重新生成候选，再选定并签字。' : '之前的签字会保留，不会自动作废。需要时按最新数据重新生成候选，再选定并签字。'}</p>` : ''}
      ${stale && st.gen === x.gen ? `<div class="btns">${btn('重新生成候选', 'c-regen', { kind: 'btn', id: t.id, icon: 'refresh' })}</div>` : ''}</div>`;
  }
  const old = dv && st.oldReceipts.length ? `<p class="tiny">历史签字 ${st.oldReceipts.length} 份已保留：${esc(st.oldReceipts.map((x) => `${x.id}（${x.cand}）`).join('，'))}</p>` : '';
  const note = noteBox(st.note);
  const tools = !dv ? '' : `<div class="demo-tools"><span>演示合同场景：</span>
    ${btn(st.lostNext ? '下次签字：回执丢失（已开启）' : '模拟回执丢失', 'c-tool-lost', { kind: 'btn-text', id: t.id, pressed: st.lostNext })}
    ${btn(st.conflictNext ? '下次签字：版本冲突（已开启）' : '模拟版本冲突', 'c-tool-conflict', { kind: 'btn-text', id: t.id, pressed: st.conflictNext })}
    ${btn('模拟输入 B 更新', 'c-tool-input', { kind: 'btn-text', id: t.id, disabled: !st.receipt || stale })}
    ${btn('重复提交同一签字', 'c-dup', { kind: 'btn-text', id: t.id, disabled: !st.receipt })}
    ${btn('同键不同内容', 'c-dup-diff', { kind: 'btn-text', id: t.id, disabled: !st.receipt })}</div>`;
  return `<div class="card section ctask"><div class="ctask-head"><div><h3>${esc(t.title)}</h3><p class="muted small">${esc(t.need)}</p></div>${dv ? badge(`第 ${st.gen} 次生成`, 'b-mute') : ''}</div>
    ${lost}${signBar}${progress}${receipt}${note}${old}<div class="cands">${cands}</div>${tools}</div>`;
}

/* ── D 验收台：规则定义（版本、检查对象）与检查运行（运行 ID、冻结快照、证据）分离 ── */
const accessBadge = (a) => (a === 'ok' ? badge('已授权', 'b-ok') : a === 'unauthorized' ? badge('未授权', 'b-warn') : a === 'notInstalled' ? badge('未安装', 'b-bad') : '');

const tgtKind = (k) => (k === 'own' ? '本岗 B' : k === 'other' ? '他人 B 引用' : '物理回传');

  const rules = `<div class="card-flat"><div class="sec-head li"><h2>${ic('shield')}${dv ? '规则清单' : '检查项'} · ${b.rules.length}</h2>${dv ? btn('模拟规则升级', 'd-rule-bump', { kind: 'btn-text', id: b.id }) : ''}</div><div class="list">${b.rules.map(ruleRow).join('')}</div></div>`;
  const runBtn = en.has('run-check') ? btn(d.phase === 'running' ? '检查中…' : '运行检查', 'd-run', { kind: 'btn', id: b.id, busy: d.phase === 'running', icon: 'play' }) : '<span class="tiny">「运行检查」未在本看板启用</span>';
  const progress = d.phase === 'running' ? `<div class="progress-line"><span class="indet"></span>${esc(dv ? d.stage : '正在检查…')} · <span data-since="${d.since}"></span></div>` : '';
  if (S.demo === 'empty') return `${rules}<div class="section">${emptyBox('play', '还没有检查记录', dv ? `「${role().bName}」中暂无记录，检查没有可读取的输入。先整理发布 B，再运行检查。` : `「${role().bName}」中还没有数据。先上传并整理资料，再运行检查。`, btn('去上传资料', 'go', { id: 'sources', icon: 'upload' }))}</div>`;
  /* 历史展示窗口（S3）：默认只渲染最近 3 次运行，更早的按需展开（收进「更多」） */
  const shown = d.showAll ? d.runs : d.runs.slice(0, 3);
  const older = d.runs.length - shown.length;
  const menu = moreMenu(`d-${b.id}`, [older > 0 ? [`查看更早的 ${older} 次${dv ? '运行' : '记录'}`, 'd-runs-all', { id: b.id, icon: 'clock' }] : null]);
  const runs = d.runs.length ? shown.map((run, i) => runCard(b, d, run, i === 0)).join('') : emptyBox('play', '还没有检查记录', dv ? '规则已定义，但还没有运行过检查。运行时会冻结当前输入快照。' : '还没有运行过检查。运行时会锁定当时的数据，结论可以复核。');
  const note = noteBox(d.note);
  return `${rules}<div class="section"><div class="sec-head"><h2>${ic('play')}${dv ? '检查运行' : '检查记录'} · ${d.runs.length}</h2><span class="btns">${runBtn}${menu}</span></div>${progress}${note}<div class="stack">${runs}</div></div>`;
}
function runCard(b, d, run, latest) {
  const exp = runExpired(run, d), dv = isDev();
  const en = RS().enabled[b.id];
  const headHtml = dv
    ? `<b class="mono">${esc(run.id)}</b>${latest ? badge('最近一次', 'b-accent') : ''}${exp ? badge(`已过期，需重新检查（${exp}）`, 'b-warn', 'clock') : ''}<span>${esc(run.at)}</span><span>规则版本：${esc(Object.entries(run.ruleVers).map(([k, v]) => `${k}@v${v}`).join('，'))}</span><span>输入快照：<span class="mono">${esc(run.snapshot)}</span></span>`
    : `<b>${esc(run.at.slice(5, 16))} 的检查</b>${latest ? badge('最近一次', 'b-accent') : ''}${exp ? badge('已过期，需重新检查', 'b-warn', 'clock') : ''}`;
  return `<div class="run-card${exp ? ' expired' : ''}"><div class="run-head">${headHtml}</div>
    <div class="list">${run.results.map((x) => {
      const esd = d.escalated[x.id];
      const rule = b.rules.find((y) => y.id === x.rule);
      const actions = [btn(dv ? '查看证据' : '查看', 'open-dres', { kind: 'btn-text', id: `${b.id}|${x.id}` })];
      const canEsc = !exp && (x.outcome === 'fail' || x.outcome === 'insufficient') && en.has('escalate-issue');
      if (esd && esd.state === 'done') actions.push(badge('已升级', 'b-ok'));
      else if (canEsc && esd) actions.push(badge(esd.state === 'submitting' ? '升级提交中' : '待你在 Agent 中确认', 'b-accent'));
      if (!exp && x.outcome === 'error' && x.retry && latest) actions.push(btn('重新运行', 'd-run', { kind: 'btn-text', id: b.id }));
      /* 升级给人、补充资料是不常用操作：收进「更多」 */
      actions.push(moreMenu(`r-${x.id}`, [
        canEsc && !esd ? ['升级给人', 'd-escalate', { id: `${b.id}|${x.id}`, icon: 'flag' }] : null,
        !exp && x.outcome === 'insufficient' ? ['补充资料', 'go', { id: 'sources', icon: 'upload' }] : null,
      ]));
      return `<div class="li"><span class="outcome ${x.outcome}">${ic(OUTCOME[x.outcome][1])}${esc(OUTCOME[x.outcome][0])}</span><span class="body"><span class="t">${esc(resObj(x))}</span><span class="d">${esc(resMsg(x))} · ${esc(dv ? x.rule : rule ? rule.name : '')}</span></span><span class="btns">${actions.join('')}</span></div>`;
    }).join('')}</div></div>`;
}

/* ── 资料（A）：上传 → 自动整理（工作流自动触发）→ 去确认 → 入库 B；只增不改，无删除、无编辑
   v2.1：员工视角分「我的资料 / 公司公开资料」，负责人加「本部门」，管理员加「全部」；指纹、来源类型代码只在开发者视角 ── */
function sourceCards() {
  const c = (icon, t, st, tone, d, off) => `<div class="src-card${off ? ' off' : ''}"><span class="top">${ic(icon)}${esc(t)}<span class="spacer"></span>${badge(st, tone)}</span><p>${esc(d)}</p></div>`;
  return `<div class="sources-grid">${c('upload', '本地上传', '可用', 'b-ok', '拖放、选择或粘贴；指纹去重，只增不改。')}${c('cloud', '外脑云端存储', '待接入', 'b-warn', '外脑文件存储已上线；Host 侧暂无插件通道。', true)}${c('mail', '邮箱', '未实现', 'b-mute', 'SourceAdapter 合同已定义，暂无真实采集器。', true)}${c('hdd', '网盘', '未实现', 'b-mute', '同上，合同已有，无采集器。', true)}${c('code', 'API', '未实现', 'b-mute', '同上，合同已有，无采集器。', true)}</div>`;
}
function reviewPanel() {
  const rs = RS(), rv = rs.review; if (!rv) return '';
  const s = srcById(rv.src), dv = isDev();
  if (rv.phase === 'running') return `<div class="review" role="status"><div class="row"><b>${ic('spinner', 16, 'spin')}正在整理「${esc(s.name)}」</b></div><div class="progress-line"><span class="indet"></span>${esc(dv ? rv.stage : '正在整理…')} · <span data-since="${rv.since}"></span></div></div>`;
  const open = s.issues.filter((x) => !x.excluded);
  const n = s.yields.length;
  const clean = !open.length, pub = rv.phase === 'publishing';
  const text = dv
    ? (clean ? `整理完成：识别 ${n} 行可发布记录${s.issues.length ? `，${s.issues.length} 行已由你决定排除` : '，0 个问题'}。发布后成为 B 的新记录（来源：导入）。` : `含 ${open.length} 行无效数据，<b>整批未发布</b>（不会只发布其中一部分）。请逐条处理：排除该行，或上传更正后的原件（新的 A）。`)
    : (clean ? `已整理出 ${n} 条记录${s.issues.length ? `，${s.issues.length} 行已由你排除` : ''}。确认后加入「${esc(role().bName)}」。` : `有 ${open.length} 处需要你确认，<b>确认前整批不会入库</b>。可以排除有问题的行，或上传更正后的原件。`);
  return `<div class="review${clean ? ' clean' : ''}"><div class="row"><b>${ic(clean ? 'check-circle' : 'alert')}${dv ? '复核问题' : '确认整理结果'} · ${esc(s.name)}</b><span class="spacer"></span>${dv ? `<span class="mono tiny">规则 ${esc(role().rule)}@${esc(role().ruleVer)} · 本地规则</span>` : ''}</div>
    <p class="small">${text}</p>
    ${s.issues.map((x, i) => `<div class="review-issue${x.excluded ? ' fixed' : ''}"><span class="loc">第 ${x.row} 行 · ${esc(x.field)}</span><span class="msg">${esc(x.msg)}</span>${x.excluded ? badge('已排除', 'b-mute') : btn('排除此行', 'rv-exclude', { kind: 'btn-text', id: s.id, id2: String(i), disabled: pub })}</div>`).join('')}
    <div class="btns">${btn(pub ? (dv ? '发布中…' : '加入中…') : dv ? `发布 ${n} 条到 B` : `确认并加入 ${n} 条`, 'rv-publish', { kind: 'btn', id: s.id, disabled: !clean, busy: pub, icon: 'check' })}${btn('稍后处理', 'rv-close', { id: s.id, disabled: pub, title: pub ? '已提交，完成前不可关闭' : '' })}${btn('上传更正后的原件', 'upload', { kind: 'btn-text', disabled: pub })}</div>${pub ? `<div class="progress-line"><span class="indet"></span>正在加入「${esc(role().bName)}」，完成前不可关闭或改选其他资料</div>` : ''}</div>`;
}
/* 行内状态：自动整理进度 → 已整理 N 条 / 有 N 处需要你确认 →「去确认」 */
function srcStatusCell(s, locked) {
  const rs = RS(), dv = isDev();
  if (s.auto) return `<span class="progress-line">${ic('spinner', 14, 'spin')}${esc(dv ? s.auto.stage : '正在整理…')}</span>`;
  const reviewingThis = rs.review && rs.review.src === s.id;
  const go = (label) => btn(label, 'organize', { id: s.id, sm: true, kind: 'btn-text', disabled: locked || (reviewingThis && rs.review.phase === 'review') });
  const rerun = dv && ['ready', 'issue', 'todo'].includes(s.st) ? btn(reviewingThis && rs.review.phase === 'running' ? '整理中…' : '重新整理', 'organize-rerun', { id: s.id, sm: true, kind: 'btn-text', disabled: locked }) : '';
  if (s.st === 'ready') return `<span class="status-cell">${badge(`已整理 ${s.yields.length} 条`, 'b-accent')}${go('去确认')}${rerun}</span>`;
  if (s.st === 'issue') return `<span class="status-cell">${badge(`有 ${s.issues.filter((x) => !x.excluded).length} 处需要你确认`, 'b-warn')}${go('去确认')}${rerun}</span>`;
  if (s.st === 'todo') return `<span class="status-cell">${badge('整理未完成', 'b-mute')}${dv ? rerun : btn('重新整理', 'organize-rerun', { id: s.id, sm: true, kind: 'btn-text', disabled: locked })}</span>`;
  if (s.st === 'unsup') return `<span class="tiny">${esc(dv ? s.unsupWhy || '仅保存原件' : '仅保存原件')}</span>`;
  return `<span class="tiny">${dv ? `${s.refs.length} 条 B 引用` : `已入库 · 用于 ${s.refs.length} 条记录`}</span>`;
}
const srcBy = (s, r = role()) => (s.origin === 'derived' ? '系统（签字后回流）' : s.by || r.user);
function mySources(list) {
  const rs = RS(), dv = isDev();

  const sorted = list.slice().sort((a, b) => b.at.localeCompare(a.at));
  const rows = sorted.map((s) => dv
    ? `<tr class="${rs.highlight === s.id ? 'hl' : ''}"><td class="cell-title"><button type="button" class="link" data-act="open-src" data-id="${esc(s.id)}">${esc(s.name)}</button></td><td>${s.origin === 'derived' ? badge('derived 回流快照', 'b-ok') : s.origin === 'paste' ? badge('粘贴', 'b-mute') : badge('上传', 'b-mute')}</td><td class="fp" title="${esc(FP_BASIS[s.fpBasis])}">${esc(s.fp.slice(0, 8))}${s.fpBasis === 'meta' ? ' · 元数据模拟' : ''}</td><td class="mono">${esc(s.at)}</td><td>${srcStatusCell(s, locked)}</td></tr>`
    : `<tr class="${rs.highlight === s.id ? 'hl' : ''}"><td class="cell-title"><button type="button" class="link" data-act="open-src" data-id="${esc(s.id)}">${esc(s.name)}</button></td><td>${esc(srcBy(s))}</td><td>${esc(s.at.slice(5, 16))}</td><td>${srcStatusCell(s, locked)}</td></tr>`).join('');
  const thead = dv ? '<th>名称</th><th>来源类型</th><th>指纹</th><th>保存时间</th><th>整理状态</th>' : '<th>文件</th><th>上传人</th><th>时间</th><th>状态</th>';
  return list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>${thead}</tr></thead><tbody>${rows}</tbody></table></div>` : emptyBox('folder', '还没有资料', dv ? '原始资料（A）是一切 B 的来源。上传银行流水、导出表或粘贴一段文本开始。' : '选择文件或粘贴文本，仅保存在本页内存；未接入通用整理器。', btn('选择文件', 'upload', { icon: 'upload' }) + btn('粘贴文本', 'paste', { icon: 'clipboard' }));
}
/* 其他岗位的资料（本部门 / 全部）：只读列表，不能整理、确认或下载。
   读取各岗位的运行态（上传、自动整理、确认入库都会反映在这里）；演示状态「空」时按零条处理 */
function otherSources(roleIds) {
  const rows = [];
  if (S.demo !== 'empty') roleIds.forEach((id) => { const r = roleById(id); if (!r) return; RSof(id).sources.forEach((s) => rows.push({ r, s })); });
  if (!rows.length) return emptyBox('folder', '没有可查看的资料', '这个范围内暂时没有其他岗位的资料。');
