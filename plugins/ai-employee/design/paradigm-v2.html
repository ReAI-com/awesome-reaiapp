    const rec = recById(f.st.receipt.inputs[0].split('@v')[0]); if (!rec) return;
    rec.v += 1; rec.history.push({ v: rec.v, at: nowStr(), by: role().user, note: '人工更正（演示：输入 B 更新）' });
    render(); toast(T(`${rec.id} 已更新为 v${rec.v}：基于旧版本的签字与检查结论将标为过期`, '数据已更新：基于旧数据的签字与检查结论将标为过期'));
  },
  /* 演示幂等：直接把原请求（同键同内容）/ 改动后的请求（同键不同内容）交给模拟服务端 */
  'c-dup': (id) => {
    const rs = RS(), f = cFind(id); if (!f || !f.st.receipt) return; const x = f.st.receipt, saved = rs.server.sign[x.key]; if (!saved) return;
    const res = serverSign(rs, f.st, saved.req);
    f.st.note = res.ok && res.receipt === x ? { tone: 'ok', text: `重复提交：同一幂等键 ${x.key}、同一内容，服务端返回原回执 ${res.receipt.id}（时间 ${res.receipt.at} 未变），没有重复签字。` } : { tone: 'warn', text: `重复提交未返回原回执：${res.code || '未知'}` };
    render();
  },
  'c-dup-diff': (id) => {
    const rs = RS(), f = cFind(id); if (!f || !f.st.receipt) return; const x = f.st.receipt, saved = rs.server.sign[x.key]; if (!saved) return;
    const other = f.st.cands.find((c) => c.id !== saved.req.candId) || f.st.cands[0];
    const res = serverSign(rs, f.st, { ...saved.req, candId: other.id, ref: other.ref });
    f.st.note = res.ok ? { tone: 'warn', text: '意外：同键不同内容被接受' } : { tone: 'warn', text: `同一幂等键 ${x.key} 提交了不同内容（改签「${other.title}」），服务端已拒绝（${res.code}），原回执不变。需要改签请重新选定，系统会使用新的幂等键。` };
    render();
  },
  'd-run': (id) => trusted(id, 'run-check', null, () => dRun(id)),
  'd-runs-all': (id) => { const d = RS().d[id]; if (d) { d.showAll = true; render(); } },
  'd-rule-bump': (id) => { const b = boardById(id), d = RS().d[id]; const r0 = b.rules[0]; d.ruleVer[r0.id] += 1; d.note = { tone: 'warn', text: `规则 ${r0.id} 已升级到 v${d.ruleVer[r0.id]}：旧检查结论标为「已过期，需重新检查」，保留供复核。`, plain: '检查规则已更新：旧结论已过期，保留供查看，需要重新检查。' }; render(); },
  'd-escalate': (id) => dEscalate(id),
  'ipo-node': (id) => {
    const n = IPO.nodes.find((x) => x.id === id); if (!n) return;
    if (n.off) { openDrawer({ kind: 'node-off', id }, document.querySelector(`[data-node="${id}"]`)); return; }
    if (id === S.roleId) { toast('这是当前岗位的插件实例'); return; }
    const nm = roleById(id).name;
    switchRole(id, `演示外壳：已切换到「${nm}」示例配置。产品中这是打开「${nm}」岗位插件实例，不在同一实例里切岗。`);
  },
  'ipo-edge': (id, t) => openDrawer({ kind: 'edge', id }, t),
  'ipo-dir': (id) => { S.ipoSel = id; S.scrollTo = `[data-node="${id}"]`; render(); },
  'wf-run': (id) => wfRun(id),
  'adj-generate': () => { const t = el('adjText'); generateProposal(t ? t.value : RS().adjust.text, 'ok'); },
  'adj-example': () => generateProposal(role().suggest[1][0], 'ok'),
  'adj-variant': (v) => {
    const texts = { field: `${ADJUST_PREFILL.replace('……', '「毛利率排行」')}按毛利率从高到低`, action: `${ADJUST_PREFILL.replace('……', '「重复记录清理」')}可以一键删除重复记录`, expired: role().suggest[1][0] };
    generateProposal(texts[v], v);
  },
  'adj-confirm': (id) => confirmProposal(id),
  'adj-discard': (id) => discardProposal(id),
  'adj-regen': () => { const rs = RS(), a = rs.adjust; if (a.gen) return; setCurrentProposal(rs, null, '提案已清空，此确认卡作废'); a.reject = null; a.note = null; a.text = ADJUST_PREFILL; S.focusAfter = 'adjText'; render(); },
  /* 公司设置保存（W16 / S4）：点击时冻结本岗位实例的草稿值与操作令牌；回调写入公司级共享设置，不读取其他岗位的当前草稿；切岗后迟到的结果忽略 */
  'set-save': () => {
    const rs = RS(); if (rs.settings.op || !atLeast('admin')) return; /* 公司设置只有管理员可改 */
    const sd = rs.setDraft;
    const snap = { company: sd.company != null ? (sd.company.trim() || PLUGIN.company) : S.company.name, money: sd.money || S.company.moneyUnit };
    const op = rs.settings.op = nextId('op');
    rs.settings.saved = ''; render();
    const ep = S.epoch, rid = S.roleId;
    setTimeout(() => {
      if (!alive(ep, rid)) return dropLate(rid, (x) => { if (x.settings.op === op) x.settings.op = null; });
      if (rs.settings.op !== op) return;
      rs.settings.op = null;
      S.company.name = snap.company; S.company.moneyUnit = snap.money; /* 写入公司级共享设置：所有岗位立即生效 */
      if (sd.company != null && (sd.company.trim() || PLUGIN.company) === snap.company) sd.company = null;
      if (sd.money === snap.money) sd.money = null;
      rs.settings.saved = `已保存（全公司生效）：公司名称「${snap.company}」，金额显示「${snap.money === 'wan' ? '万元' : '元'}」。`;
      render();
    }, 500);
  },
  'dev-unlock': () => { const d = RS().dev; if (d.pw === DEV_PASSWORD) { d.unlocked = true; d.err = ''; d.pw = ''; toast('开发模式已解锁（不是访问权限）'); } else { d.err = '密码不正确，配置未解锁。演示密码为 0000。'; } render(); },
  'dev-lock': () => { RS().dev.unlocked = false; render(); },
  'host-agent-config': () => toast('演示：将打开 Host「设置 › 插件 Agent 配置」（system.tasks@1 的 agent-config 入口）'),
  'copy-diag': (id, t) => {
    const pre = t.closest('.diag') && t.closest('.diag').querySelector('pre'); if (!pre) return;
    const text = pre.textContent;
    const fail = () => { const range = document.createRange(); range.selectNodeContents(pre); const s = window.getSelection(); s.removeAllRanges(); s.addRange(range); toast('复制失败：已选中诊断文本，请手动复制'); };
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('诊断已复制：仅步骤 ID、看板 ID、错误码与版本'), fail); else fail(); } catch (e) { fail(); }
  },
  'dismiss-notice': () => { RS().notice = null; render(); },
  'err-retry': () => { S.demo = 'loading'; render(); setTimeout(() => { if (S.demo === 'loading') { S.demo = 'normal'; render(); toast(T('重试成功（同一幂等键）', '重试成功')); } }, 1200); },
  'err-poll': () => toast(T('按受理回执中的服务任务 ID 继续查询，不重新发起', '正在继续查询结果')),
  'err-resubmit': () => toast(T('用原会话、原幂等键与完整原请求再次提交，取回原回执后再查询', '正在再次确认结果，不会重复提交')),
  'err-local': () => { S.demo = 'normal'; render(); toast('已切到本地演示'); },
  'err-perm': () => toast('演示：将引导到 Host「已安装 → 权限」，插件不自行弹授权框'),
  'err-quota': () => toast('额度不足：补充额度后可再次使用 Agent；本错误无重试'),
  'err-refresh': () => toast('刷新到最新版本后，确认内容再提交'),
  'err-regen': () => go('adjust'),
  toast: (id) => toast(id),
  noop: () => {},
};

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  /* 点在菜单之外（或点了菜单里的项）一律收起菜单；点在 (i) 之外收起固定的提示 */
  const fromMenu = !!(t && el('menuLayer').contains(t)), menuKey = fromMenu ? MENU.key : null;
  if (!t || t.dataset.act !== 'menu') closeMenus(false);
  if (TIP.pinned && (!t || t !== TIP.target)) tipHide();
  if (!t || t.disabled || t.getAttribute('aria-disabled') === 'true') {
    if (e.target === el('scrim')) closeDrawer('scrim');
    if (S.demoMenu && !e.target.closest('[id="demobar"]')) { S.demoMenu = false; renderDemobar(); }
    return;
  }
  if (S.demoMenu && !t.closest('[id="demobar"]')) { S.demoMenu = false; renderDemobar(); }
  const h = ACT[t.dataset.act];
  if (h) h(t.dataset.id, t, t.dataset.id2, e);
  /* 菜单项执行后（S1）：动作自己安排了焦点（确认卡首个选项、抽屉关闭钮等）就不动；否则回到触发按钮，按钮已不在则回到内容区 */
  if (fromMenu) requestAnimationFrame(() => {
    const a = document.activeElement;
    if (a && a !== document.body && a.isConnected && !el('menuLayer').contains(a)) return;
    const b = menuKey && document.querySelector(menuKey);
    (b && !b.disabled ? b : el('content')).focus({ preventScroll: true });
  });
});
document.addEventListener('change', (e) => {
  const t = e.target, ch = t.dataset && t.dataset.ch; if (!ch) return;
  if (ch === 'role') switchRole(t.value);
  else if (ch === 'demo') { S.demo = t.value; render(); }
  else if (ch === 'money') RS().setDraft.money = t.value;
  else if (ch === 'dev-board') { RS().dev.board = t.value; render(); }
  else if (ch === 'dev-action') {
    const rs = RS(), set = rs.enabled[t.dataset.id]; if (!set) return;
    if (t.checked) set.add(t.value); else set.delete(t.value);
    rs.profileVersion += 1; render();
    toast(`岗位配置已更新为 v${rs.profileVersion}：之前生成的看板提案将过期`);
  } else if (ch === 'edit-value') { const e2 = RS().edit; if (e2) e2.value = t.value; }
});
document.addEventListener('input', (e) => {
  const t = e.target, k = t.dataset && t.dataset.in; if (!k) return;
  if (k === 'agent-draft') RS().draft = t.value;
  else if (k === 'adjust-text') RS().adjust.text = t.value;
  else if (k === 'company') RS().setDraft.company = t.value;
  else if (k === 'ix-text') RS().ixDraft[t.dataset.id] = t.value;
  else if (k === 'dev-pw') RS().dev.pw = t.value;
  else if (k === 'edit-value') { const e2 = RS().edit; if (e2) e2.value = t.value; }
  else if (k === 'paste-name' && S.drawer) S.drawer.name = t.value;
  else if (k === 'paste-text' && S.drawer) S.drawer.text = t.value;
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (TIP.target && TIP.pinned) { e.preventDefault(); tipHide(); return; } /* 固定的提示先收起；下一次 Esc 再关外层 */
    if (TIP.target) tipHide();
    if (MENU.trigger) { e.preventDefault(); closeMenus(true); return; }
    if (S.drawer) { e.preventDefault(); closeDrawer('esc', el('layer').contains(e.target)); return; }
    if (S.demoMenu) { S.demoMenu = false; renderDemobar(); const b = document.querySelector('[data-act="demo-menu"]'); if (b) b.focus(); return; }
    if (S.agentOpen && isMobile() && el('agent').contains(e.target)) { S.agentOpen = false; render(); const b = document.querySelector('[id="mhead"] [data-act="agent-toggle"]'); if (b) b.focus(); }
    return;
  }
  if (MENU.trigger && el('menuLayer').contains(e.target)) { /* 菜单内：上下键 / Home / End 移动，Tab 收起并回到触发按钮 */
    const items = [...el('menuLayer').querySelectorAll('button:not([disabled])')], i = items.indexOf(document.activeElement);
    if (e.key === 'Tab') { e.preventDefault(); closeMenus(true); return; }
    const to = e.key === 'ArrowDown' ? (i + 1) % items.length : e.key === 'ArrowUp' ? (i - 1 + items.length) % items.length : e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : -1;
    if (to >= 0 && items.length) { e.preventDefault(); items[to].focus(); return; }
  }
  if (e.key === 'Tab' && S.drawer) { /* 焦点陷阱 */
    const list = focusables(el('drawer')); if (!list.length) return;
    const first = list[0], last = list[list.length - 1];
    if (!el('drawer').contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (e.key === 'Enter' && e.target.id === 'agInput' && !e.shiftKey && !e.isComposing) { e.preventDefault(); agentSend(e.target.value, undefined, true); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.getAttribute && e.target.getAttribute('role') === 'button' && e.target.tagName !== 'BUTTON') { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
});
el('filePick').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
document.addEventListener('dragover', (e) => { const z = e.target.closest && e.target.closest('[id="dropzone"]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', (e) => { const z = e.target.closest && e.target.closest('[id="dropzone"]'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', (e) => { const z = e.target.closest && e.target.closest('[id="dropzone"]'); if (z) { e.preventDefault(); z.classList.remove('over'); addFiles(e.dataTransfer.files); } });
/* 已用时间：超过 1 秒才显示 */
setInterval(() => { document.querySelectorAll('[data-since]').forEach((n) => { const s = (Date.now() - Number(n.dataset.since)) / 1000; n.textContent = s >= 1 ? `已用 ${Math.floor(s)} 秒` : '刚开始'; }); }, 250);

/* 滚动条显隐（U1）：一个委托的 scroll 监听（capture，可捕获任意容器的滚动）给正在滚动的元素加 .is-scrolling；
   全局只有一个清理计时器，按最后滚动时间统一清除，节点脱离文档即丢弃，不为每个元素各挂计时器 */
const SB = { live: new Map(), timer: 0 };
function sbSweep() {
  SB.timer = 0; const now = Date.now(); let next = Infinity;
  SB.live.forEach((at, n) => { if (!n.isConnected || now - at >= 1000) { n.classList.remove('is-scrolling'); SB.live.delete(n); } else next = Math.min(next, at + 1000 - now); });
  if (SB.live.size) SB.timer = setTimeout(sbSweep, Math.max(50, next));
}
document.addEventListener('scroll', (e) => {
  const n = e.target === document ? document.scrollingElement : e.target;
  if (!n || !n.classList) return;
  if (!SB.live.has(n)) n.classList.add('is-scrolling');
  SB.live.set(n, Date.now());
  if (!SB.timer) SB.timer = setTimeout(sbSweep, 1000);
}, { capture: true, passive: true });

/* ── 启动 ── */
(function init() {
  if (window.innerWidth < 720) { S.agentOpen = false; S.width = '390'; }
  ROLES.forEach((r) => {
    const rs = S.roles[r.id] = initRole(r);
    rs.messages.push({ id: nextId('msg'), at: '2026-10-14 09:00:00', role: 'agent', parts: [{ kind: 'text', text: `我是「${r.name}」岗位 Agent（演示分析）。我基于本岗「${r.bName}」解释数据，事实、推测与过程分开说；需要你确认的事会以确认卡发来。` }, { kind: 'thinking' }] });
  });
  render({ reset: true });
})();
</script>
