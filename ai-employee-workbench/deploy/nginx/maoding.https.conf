limit_req_zone $binary_remote_addr zone=maoding_login:1m rate=6r/m;

# Replace the initial HTTP virtual host with this file after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name maoding.reai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://maoding.reai.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maoding.reai.com;

    ssl_certificate /etc/letsencrypt/live/maoding.reai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maoding.reai.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:maoding_tls:10m;
    ssl_session_timeout 1d;

    # Per-file application limit is 30 MiB; this caps an entire upload batch.
    client_max_body_size 64m;
    client_body_timeout 60s;

    location = /api/auth/login {
        limit_req zone=maoding_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:14317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # OAuth callback query strings contain a short-lived code; omit access logs.
    location = /api/auth/callback {
        access_log off;
        proxy_pass http://127.0.0.1:14317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:14317;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Keep the board's scoped Bearer token; app endpoints use OAuth sessions.
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
