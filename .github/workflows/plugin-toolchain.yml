name: Plugin toolchain

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'plugins/**'
      - 'examples/**'
      - 'scripts/plugin-*.ts'
      - 'scripts/source-review-bytes.ts'
      - 'scripts/verify-platform-packages.ts'
      - '.github/workflows/plugin-toolchain.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'plugins/**'
      - 'examples/**'
      - 'scripts/plugin-*.ts'
      - 'scripts/source-review-bytes.ts'
      - 'scripts/verify-platform-packages.ts'
      - '.github/workflows/plugin-toolchain.yml'

permissions:
  contents: read

jobs:
  shared-tools:
    name: Verify shared tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Reject Host-only contracts
        run: |
          # Host 专用合同（含 Host 登录标识）只保留在主项目，不进入公开包。
          if [ -e packages/contract/official-host-dependencies.json ]; then
            echo "packages/contract/official-host-dependencies.json is Host-only and must not be published." >&2
            exit 1
          fi
      - name: Install shared dependencies
        working-directory: packages
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test shared tools
        working-directory: packages
        run: bun run test
      - name: Check shared types
        working-directory: packages
        run: bun run typecheck
      - name: Verify packed tools outside the repository
        working-directory: packages
        run: bun run verify:pack

  examples:
    name: Verify example ${{ matrix.example }}
    needs: shared-tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [todo-app, titlebar-actions-app, skins/codex, skins/claude]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Install shared dependencies
        working-directory: packages
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install example dependencies
        working-directory: examples/${{ matrix.example }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test the example
        working-directory: examples/${{ matrix.example }}
        run: bun run test
      - name: Check example types
        working-directory: examples/${{ matrix.example }}
        run: bun run typecheck
      - name: Validate the example
        working-directory: examples/${{ matrix.example }}
        run: bun run validate
      - name: Build the example
        working-directory: examples/${{ matrix.example }}
        run: bun run build
      - name: Test example contracts
        working-directory: examples/${{ matrix.example }}
        run: bun run test:contract
      - name: Pack the example
        working-directory: examples/${{ matrix.example }}
        run: bun run pack

  plugins:
    name: Verify plugin ${{ matrix.plugin }}
    needs: shared-tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - ai-employee
          - ai-patent-assistant
          - agents-im
          - agents-tasks
          - browser
          - code-worker
          - codex-app
          - codex-link
          - computer
          - device-doctor
          - dsh-agent
          - files
          - pi-agent
          - podcast
          - terminal
          - text-editor
          - voice
          - wishing-wall
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Install shared dependencies
        working-directory: packages
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install plugin dependencies
        working-directory: plugins/${{ matrix.plugin }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test the plugin
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run test
      - name: Check plugin types
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run typecheck
      - name: Validate the plugin
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run validate
      - name: Build the plugin
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run build
      - name: Test plugin contracts
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run test:contract
      - name: Pack the plugin
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run pack
      - name: Pack the plugin with Deflate
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          # 插件自己的锁文件必须带上语言工具的压缩依赖；只看共享工具的验证发现不了这类缺失。
          if jq -e '(.dependencies // {}) + (.devDependencies // {}) | has("@reai/app-i18n-cli")' package.json >/dev/null; then
            bunx reai-app-i18n pack . --out "$RUNNER_TEMP/${{ strategy.job-index }}-deflate.reaiapp" --compression deflate
          else
            echo "Plugin does not use the language toolchain; Deflate packing is not applicable."
          fi
