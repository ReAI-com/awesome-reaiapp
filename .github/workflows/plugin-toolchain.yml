name: Plugin toolchain

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'plugins/**'
      - 'examples/**'
      - 'scripts/plugin-*.ts'
      - 'scripts/source-review-bytes.ts'
      - 'scripts/verify-platform-packages.ts'
      - '.github/workflows/plugin-toolchain.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'plugins/**'
      - 'examples/**'
      - 'scripts/plugin-*.ts'
      - 'scripts/source-review-bytes.ts'
      - 'scripts/verify-platform-packages.ts'
      - '.github/workflows/plugin-toolchain.yml'

permissions:
  contents: read

jobs:
  shared-tools:
    name: Verify shared tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Install shared dependencies
        working-directory: packages
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test shared tools
        working-directory: packages
        run: bun run test
      - name: Check shared types
        working-directory: packages
        run: bun run typecheck
      - name: Verify packed tools outside the repository
        working-directory: packages
        run: bun run verify:pack

  examples:
    name: Verify example ${{ matrix.example }}
    needs: shared-tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [todo-app, titlebar-actions-app, skins/codex, skins/claude]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Install shared dependencies
        working-directory: packages
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install example dependencies
        working-directory: examples/${{ matrix.example }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test the example
        working-directory: examples/${{ matrix.example }}
        run: bun run test
      - name: Check example types
        working-directory: examples/${{ matrix.example }}
        run: bun run typecheck
      - name: Validate the example
        working-directory: examples/${{ matrix.example }}
        run: bun run validate
      - name: Build the example
        working-directory: examples/${{ matrix.example }}
        run: bun run build
      - name: Test example contracts
        working-directory: examples/${{ matrix.example }}
        run: bun run test:contract
      - name: Pack the example
        working-directory: examples/${{ matrix.example }}
        run: bun run pack

  plugins:
    name: Verify plugin ${{ matrix.plugin }}
    needs: shared-tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - ai-employee
          - agents-im
          - agents-tasks
          - browser
          - code-worker
          - codex-app
          - codex-link
          - computer
          - device-doctor
          - dsh-agent
          - pi-agent
          - podcast
          - terminal
          - text-editor
          - wishing-wall
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Install shared dependencies
        working-directory: packages
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install plugin dependencies
        working-directory: plugins/${{ matrix.plugin }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test the plugin
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run test
      - name: Check plugin types
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run typecheck
      - name: Validate the plugin
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run validate
      - name: Build the plugin
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run build
      - name: Test plugin contracts
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run test:contract
      - name: Pack the plugin
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run pack

  voice-source-review-rejection:
    name: Check review rejections for Voice
    needs: shared-tools
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.11'
      - name: Install shared dependencies
        working-directory: packages
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Voice dependencies
        working-directory: plugins/voice
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test Voice
        working-directory: plugins/voice
        run: bun run test
      - name: Check Voice types
        working-directory: plugins/voice
        run: bun run typecheck
      - name: Check all three expected rejections
        working-directory: plugins/voice
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          expected = {
              "surface.clipboard@1",
              "agent.session@2",
              "system.folder-pick@1",
              "local.terminal.exec@1",
          }
          headers = {
              "validate": "Plugin language validation failed",
              "build": "Manifest 校验未通过，构建中止",
              "pack": "Plugin language validation failed",
          }
          finding = re.compile(
              r"\[APP_CAPABILITY_NOT_GRANTED\] requires\.hostCapabilities\[\d+\]: "
              r"([a-z][a-z0-9.-]*@\d+) requires an applicable source review approval"
          )
          output = Path("voice-public-clone-must-be-rejected.reaiapp")
          if output.exists():
              sys.exit("The rejection check requires an absent output package.")
          for stage, header in headers.items():
              command = ["bun", "../../packages/i18n-cli/src/cli.ts", stage, "."]
              if stage == "pack":
                  command += ["--out", str(output)]
              result = subprocess.run(command, capture_output=True, text=True, timeout=300)
              diagnostic = result.stdout + result.stderr
              sys.stdout.write(diagnostic)
              lines = [line.strip() for line in diagnostic.splitlines() if line.strip()]
              matches = [finding.fullmatch(line) for line in lines if line != header]
              rejected = {match.group(1) for match in matches if match}
              if (
                  result.returncode != 1
                  or lines.count(header) != 1
                  or len(matches) != 4
                  or not all(matches)
                  or rejected != expected
                  or output.exists()
              ):
                  sys.exit(f"Voice {stage} did not return only the four expected capability rejections.")
              print(f"PASS: Voice {stage} returned the four expected capability rejections.")
          PY
