name: Plugin toolchain

on:
  pull_request:
    paths:
      - 'vendor/**'
      - 'plugins/**'
      - 'examples/**'
      - 'scripts/**'
      - '.github/workflows/plugin-toolchain.yml'
  push:
    branches: [main]
    paths:
      - 'vendor/**'
      - 'plugins/**'
      - 'examples/**'
      - 'scripts/**'
      - '.github/workflows/plugin-toolchain.yml'

permissions:
  contents: read

jobs:
  vendor-platform:
    name: Verify vendored platform packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Test repository scripts
        run: bun test scripts
      - name: Verify vendored platform packages
        # 平台包以主项目为正本：tarball、lock 与来源回执按摘要互相钉住，插件仓不得改动。
        run: bun scripts/verify-vendor-platform.ts

  examples:
    name: Verify example ${{ matrix.example }}
    needs: vendor-platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [todo-app, titlebar-actions-app, capability-probe, project-data-app, workflow-app, skins/codex, skins/claude]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install example dependencies
        working-directory: examples/${{ matrix.example }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test the example
        working-directory: examples/${{ matrix.example }}
        run: bun run test
      - name: Check example types
        working-directory: examples/${{ matrix.example }}
        run: bun run typecheck
      - name: Validate the example
        working-directory: examples/${{ matrix.example }}
        run: bun run validate
      - name: Build the example
        working-directory: examples/${{ matrix.example }}
        run: bun run build
      - name: Test example contracts
        working-directory: examples/${{ matrix.example }}
        run: bun run test:contract
      - name: Pack the example
        working-directory: examples/${{ matrix.example }}
        run: bun run pack

  plugins:
    name: Verify plugin ${{ matrix.plugin }}
    needs: vendor-platform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - ai-employee
          - ai-patent-assistant
          - agents-im
          - agents-tasks
          - browser
          - code-worker
          - codex-app
          - codex-link
          - computer
          - device-doctor
          - dsh-agent
          - files
          - pi-agent
          - podcast
          - terminal
          - text-editor
          - voice
          - wishing-wall
    env:
      # 受控插件的当前候选尚未通过源码审核：只要求按审批门被拒。审核通过、平台包带上批准记录后从这里移除。
      AWAITING_REVIEW: ${{ contains(fromJSON('["voice"]'), matrix.plugin) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install plugin dependencies
        working-directory: plugins/${{ matrix.plugin }}
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Test the plugin
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run test
      - name: Check plugin types
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run typecheck
      - name: Validate the plugin
        if: env.AWAITING_REVIEW != 'true'
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run validate
      - name: Build the plugin
        if: env.AWAITING_REVIEW != 'true'
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run build
      - name: Test plugin contracts
        if: env.AWAITING_REVIEW != 'true'
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run test:contract
      - name: Pack the plugin
        if: env.AWAITING_REVIEW != 'true'
        working-directory: plugins/${{ matrix.plugin }}
        run: bun run pack
      - name: Pack the plugin with Deflate
        if: env.AWAITING_REVIEW != 'true'
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          # 插件自己的锁文件必须带上语言工具的压缩依赖；只看共享工具的验证发现不了这类缺失。
          if jq -e '(.dependencies // {}) + (.devDependencies // {}) | has("@reai/app-i18n-cli")' package.json >/dev/null; then
            bunx --no-install reai-app-i18n pack . --out "$RUNNER_TEMP/${{ strategy.job-index }}-deflate.reaiapp" --compression deflate
          else
            echo "Plugin does not use the language toolchain; Deflate packing is not applicable."
          fi
      - name: Expect the source-review rejection
        if: env.AWAITING_REVIEW == 'true'
        working-directory: plugins/${{ matrix.plugin }}
        run: bash ../../scripts/expect-review-rejection.sh validate build pack
