name: Public gate

# 公开仓提交前的通用泄露闸门：提交身份、打包收据、密钥形态、个人绝对路径、真实邮箱。
# 不设路径过滤，任何改动都扫描整棵树（含 vendor tarball 与 .reaiapp 解包内容）。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-gate:
    name: Scan the repository for private data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Prove the gate blocks a synthetic leak
        run: |
          probe="$RUNNER_TEMP/gate-probe"
          mkdir -p "$probe/plugins/demo"
          printf '{"productId":"synthetic"}\n' > "$probe/plugins/demo/submission.identity.json"
          # 只接受「命中」（退出码 1）且命中预期规则；工具异常（2、127、被杀）不能冒充拦截成功。
          set +e
          bun scripts/public-gate.ts --root "$probe" >"$RUNNER_TEMP/gate-probe.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/gate-probe.log"
          if [ "$status" -ne 1 ] || ! grep -q 'plugins/demo/submission.identity.json \[forbidden-identity-file\]' "$RUNNER_TEMP/gate-probe.log"; then
            echo "public gate did not block a synthetic submission identity (exit $status)" >&2
            exit 1
          fi
      - name: Run the public gate
        # 按 Git 跟踪清单（NUL 分隔）扫描提交树全部文件，被跟踪的依赖目录与特殊文件名同样覆盖。
        # 导出物自带的豁免与插件仓自有豁免分两个文件，均按文件摘要绑定。
        run: bun scripts/public-gate-tracked.ts --allow scripts/public-gate.allow.json --allow scripts/public-gate.local-allow.json
